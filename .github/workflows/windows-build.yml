# Windows 安装包（自研安装器 + 绿色版）—— **本机是 macOS 时唯一能拿到 .exe 的路**。
#
# 为什么不在本机交叉编译：`makensis`、MSVC 库、WebView2 导入库都要 Windows 那一套。
# **构建可以分批，发布必须统一**：这条工作流只负责「按某一笔源码编出包 + 回执」，然后
# 把产物交给发布内核；建 Release、上传 Gitee、镜像 GitHub、改清单、打 tag 一行都不在这里。
#
# 触发方式：
#   - `workflow_dispatch`（发布内核调它）：给 `source_sha` 与 `version`，检出那一笔构建；
#   - push `feat/**`：合并前也能出包验证（不参与发布）。
#
# 产物：
#   `SupportEase_<版本>_x64-setup.exe`（自研安装器）
#   `SupportEase_<版本>_x64-portable.zip`（绿色版）
#   `build-receipt.json`（版本 / 源码 SHA / 每个文件的 size+sha256，给内核交叉核对）

name: windows-build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: '被构建的那一笔提交（发布内核的冻结源码）'
        required: true
      version:
        description: '这一版的版本号（x.y.z 或 x.y.z-preview.N）'
        required: true
  push:
    branches: ['feat/**']
    paths-ignore:
      - 'presets/delivery/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  windows:
    name: windows-nsis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # ★ 构建哪一笔由调用方点名；分支 push 时退回这一笔
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: 核对被构建的源码
        shell: bash
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          echo "HEAD=$head_sha"
          if [ -n "${{ inputs.source_sha }}" ] && [ "$head_sha" != "${{ inputs.source_sha }}" ]; then
            echo "::error::检出的提交 $head_sha 不是冻结源码 ${{ inputs.source_sha }}"
            exit 1
          fi
          got=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.version }}" ] && [ "$got" != "${{ inputs.version }}" ]; then
            echo "::error::这一笔的版本号是 $got，调用方要发 ${{ inputs.version }}"
            exit 1
          fi
          echo "version=$got" >> "$GITHUB_ENV"
          echo "source_sha=$head_sha" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: 准备工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V && cargo -V

      - name: 缓存 cargo registry 与 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-build-

      - run: npm ci

      - name: 构建安装包（自研安装器）
        run: npm run build:installer

      - name: 构建绿色版（zip）
        run: npm run build:portable

      - name: 写构建回执
        shell: bash
        run: |
          set -euo pipefail
          node -e "
          const fs=require('fs'), crypto=require('crypto'), path=require('path');
          const v=process.env.version;
          const files=[
            'target/release/bundle/nsis/SupportEase_'+v+'_x64-setup.exe',
            'dist-portable/SupportEase_'+v+'_x64-portable.zip',
          ].map(p=>{
            const b=fs.readFileSync(p);
            return {name:path.basename(p), size:b.length, sha256:crypto.createHash('sha256').update(b).digest('hex')};
          });
          const receipt={version:v, source_sha:process.env.source_sha, platform:'windows', arch:'x64', files, builtAt:new Date().toISOString(), run_id:process.env.GITHUB_RUN_ID};
          fs.writeFileSync('build-receipt.json', JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          "

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SupportEase-windows-${{ env.source_sha }}
          path: |
            target/release/bundle/nsis/*.exe
            dist-portable/*.zip
            build-receipt.json
          if-no-files-found: error
