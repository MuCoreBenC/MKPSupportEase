# Windows 安装包（NSIS）—— **本机是 macOS 时唯一能拿到 .exe 的路**。
#
# 为什么不在本机交叉编译：`release_tx::installer_plan()` 按宿主分流
# （macOS → dmg / Windows → NSIS），dmg 要 `hdiutil`、NSIS 要 `makensis`，
# 两边各自的本机打包链都在场才好使；从 macOS 打 Windows 包不是"多传一个 --target"
# 的事（MSVC 库、WebView2 导入库、NSIS 插件都要 Windows 那一套）。
#
# 触发方式：
#   - push tag `v*`：发版时自动出一份与 tag 同版本的 exe；
#   - push `feat/**`：合并前也能出包验证（正式发版前的真机检查）；
#   - workflow_dispatch：合并之后在 Actions 页面手动跑。
#
# 产物：`SupportEase_<版本>_x64-setup.exe`，在本 run 的 Artifacts 里。
# 发布上传仍由 `release_tx`（Gitee Release）负责 —— 这里只构建，不碰任何发布通道。

name: windows-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['feat/**']

permissions:
  contents: read

jobs:
  windows:
    name: windows-nsis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # runner 自带 rustup，不引第三方 action（与 ci.yml 同一条纪律）
      - name: 准备工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V && cargo -V

      - name: 缓存 cargo registry 与 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-build-

      - run: npm ci

      # `--bundles nsis`：只出 .exe，不碰 msi（WiX 那条链要额外下载与更长的时间）。
      # 版本号来自 tauri.conf.json（由 src-tauri/Cargo.toml 派生，四处同源）。
      - name: 构建 NSIS 安装包
        run: npm run tauri -- build --bundles nsis

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: SupportEase-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
