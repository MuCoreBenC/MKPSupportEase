# CI —— 第一个 PR 之前就要存在的那层。
#
# 两个 job 的名字是 `web` 与 `rust`，必须和 scripts/setup-ruleset.mjs 里的
# REQUIRED_CHECKS 逐字对上（Task 16 把它们挂成必需检查）。改名等于把闸门拆了。
#
# 早先这里有一段"探测 + 跳过"的逻辑，用来在前端 / Rust 侧还没搬进来的阶段放行。
# 现在两边都在了，那段整个删掉 —— "允许跳过"与试验场那七道空转的闸是同一个失效模式，
# 留着一天就有一天会骗过人。

name: ci

on:
  pull_request:
  push:
    branches: [main]

# 同一分支连续 push 时取消上一次，省额度也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # npm ci 会触发 prepare（scripts/setup-hooks.mjs）。
      # 那个脚本的第一条约束就是"任何情况下都不能让 npm install 失败"，这一步顺带天天在验它。
      - run: npm ci

      - name: eslint + stylelint
        run: npm run lint

      - name: 类型检查
        run: npx tsc -b

      - name: 构建
        run: npm run build

      # 判据 1（DATA-ARCHITECTURE.md §5）：铁律不许只写在文档里。扫客户端构建产物，
      # 开发源 TOML / 模拟数据 / 工作台内容出现即红。只对客户端构建跑——
      # 工作台构建故意带那些东西，不在本判据管辖内
      - name: 安装包产物扫描
        run: npm run check:bundle

      # 判据 2（DATA-ARCHITECTURE.md §5 第 2 条）：启动零网络。
      # 扫源码而不是产物：要看的是"程序起来那一刻动没动网络"，那是代码形状的问题，
      # 产物里问不出来。三道闸——网络符号只许住在 runtime/net.rs、启动段零联网、
      # 前端不许绕过 IPC 自己发 HTTP
      - name: 启动零网络扫描
        run: npm run check:zero-network

      # 资源寻址 M6 判据（`docs/RESOURCE-ADDRESSING-ROADMAP.md` §5-M6）：
      # 0.0.6 起 release.json 的下载地址一律来自 Gitee Release（发布仓库），
      # 禁止 github.com/.../releases。v≤0.0.5 是断代前的历史记录，照旧合法。
      - name: 软件发布源扫描（断代后禁 GitHub Releases）
        run: npm run check:release-source

  rust:
    name: rust
    # macOS 而不是 ubuntu：Tauri 的 Rust 侧在 Linux 上要先装 libwebkit2gtk 等一串系统包，
    # 而本产品只发 macOS。跑在目标平台上，CI 绿才等于"我这台机器上也能编"。
    # 公开仓库的 macOS runner 不计费，所以这个选择不花钱。
    runs-on: macos-latest
    # **在仓库根跑，不在 `src-tauri` 里跑。** 建了 workspace（b04 Task 13）之后，
    # virtual manifest 的默认成员就是全部成员 —— 在根上跑，`fmt --all` /
    # `clippy --all-targets` / `test` 的覆盖面会自动跟着长；在成员目录里跑则只覆盖那一个包。
    # 代价是 `--features` 在 virtual 根上不合法，工作台那两条要带 `-p` 指定包。
    steps:
      - uses: actions/checkout@v5

      # runner 自带 rustup，不引第三方 action —— 少一个供应链入口
      - name: 准备工具链
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -V && cargo -V

      - name: 缓存 cargo registry 与 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 格式
        run: cargo fmt --all -- --check

      # --all-targets 让测试代码也过 clippy；clippy.toml 的 disallowed-methods 在这里生效。
      #
      # **两种 feature 组合都要跑。** 工作台是 `#[cfg(feature = "workbench")]` 门内的，
      # 不启用 feature 时那整棵子树**连编译都不会被碰** —— 于是它的写盘约束、
      # 它的 264 条判据，在 CI 里等于从来没有被检过。这不是覆盖率的小数点问题，
      # 而是唯一会写 `presets/`（用户数据）的那棵树整个不在场。
      - name: clippy（默认 feature）
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy（workbench）
        run: cargo clippy --all-targets -p mkp-support-ease --features workbench -- -D warnings

      - name: 测试（默认 feature）
        run: cargo test

      - name: 测试（workbench）
        run: cargo test -p mkp-support-ease --features workbench

      # 资源寻址立法（`docs/RESOURCE-ADDRESSING-ROADMAP.md` §6.4）：
      # ① 拼接越界 —— join_url 只许住在 runtime/resolver（模块可见性是墙，这条 grep
      #    是绊线：谁把拼接函数挪出去/抄一份，这里红）；② 交付面禁止绝对 URL ——
      #    source.json 是双镜像（GitHub/Gitee）共用的寻址规则声明，写死任何一家
      #    的绝对地址等于把另一家镜像的用户指回去。真正的逐条对账由发布闸
      #    ⑯（client/url-reconciliation，直调生产 Resolver）与 Golden Fixture 负责。
      - name: 寻址立法扫描（拼接越界 + 交付面无绝对 URL）
        run: |
          if grep -rnE 'join_url\s*\(' src-tauri/src --include='*.rs' | grep -v 'runtime/resolver' | grep -vE '^[^:]+:[0-9]+:\s*(//|///)'; then
            echo "::error::路径拼接跑出了 runtime/resolver —— 寻址唯一出口在 resolver 模块"
            exit 1
          fi
          if grep -E 'https?://' presets/delivery/source.json; then
            echo "::error::交付面（source.json）禁止绝对 URL —— 双镜像共用同一份寻址声明"
            exit 1
          fi

  # Windows 侧单独一个 job，**不并进 rust 的 matrix**：
  # matrix 会把 job 名变成 `rust (macos-latest)`，而 ruleset 里的必需检查叫 `rust` ——
  # 改名等于那条必需检查永远等不到，PR 再也合不进去。
  #
  # 存在的理由：`src-tauri/tauri.windows.conf.json`（decorations: false + 自绘窗口键）
  # 与那几段 `#[cfg(not(target_os = "macos"))]` 在 macOS 上一行都不会被编译，
  # 等于完全没验证过。开发会在 Windows 上进行，这一档就是那边的编译保险。
  rust-windows:
    name: rust-windows
    runs-on: windows-latest
    # 同 `rust`：在仓库根跑，覆盖全部成员（理由写在那边）。
    steps:
      - uses: actions/checkout@v5

      - name: 准备工具链
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -V
          cargo -V

      - name: 缓存 cargo registry 与 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # **这一档刻意不启用 `workbench`。** 它的存在理由是 `#[cfg(not(target_os = "macos"))]`
      # 那几段在 macOS 上一行都不会被编译；而 `src/workbench/**` 里
      # `cfg(not(target_os` / `cfg(target_os` / `cfg(windows` / `cfg(unix)` **零命中** ——
      # 工作台没有平台相关的编译分支，在 Windows 上再跑一遍得不到新信息，只是多花一份 runner。
      # 哪天工作台里出现了平台分支，这里要跟着加上（那时这条注释就是提醒）。
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test
