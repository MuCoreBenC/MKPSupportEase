# CI —— 第一个 PR 之前就要存在的那层。
#
# 三个 job：`web` / `rust`(macOS) / `rust-windows`。必需检查是 `web` 与 `rust-windows`，
# 名字必须与 scripts/setup-ruleset.mjs 的 REQUIRED_CHECKS 逐字对上。
# macOS 那份仍跑（平台覆盖），但不设必需：它与 rust-windows 跑的是同一串命令，
# 公共 macOS runner 排队常常十几分钟甚至被 CANCELLED，发版等它等于白等几个小时。
#
# 早先这里有一段"探测 + 跳过"的逻辑，用来在前端 / Rust 侧还没搬进来的阶段放行。
# 现在两边都在了，那段整个删掉 —— "允许跳过"与试验场那七道空转的闸是同一个失效模式，
# 留着一天就有一天会骗过人。
#
# ## 2026-11-05：数据发布不陪跑 Rust 编译
#
# 「发布一批预设」改的是 `presets/delivery/` 下的产物字节：没有一行 Rust，没有一行 TS。
# 让它等 macOS + Windows 两套 clippy/test，是在用错闸门（作者："为什么就发布一个预设，
# 他就要走这么完整的 PR"）。所以每个重 job 先做一次**变更分类**：
#
# · 只动交付产物 / 文档 ⇒ 跳过编译与测试，job 仍以 success 收尾；
# · 有任何代码变更（`src/`、`src-tauri/`、`scripts/`、`.github/`、`Cargo.*` …）⇒ 全套照跑。
#
# ★ **不能**用 workflow 级的 `paths` 过滤：那样 workflow 根本不触发，
#   而 ruleset 要求的 `rust` / `rust-windows` 是**必需检查**——检查永远不出现，
#   PR 就永远合不了。必须让 job 跑起来、只是不做重活。
# ★ 判定拿不到基线（首次 push / 全 0 的 before）时**按代码变更处理**：宁可多跑，不放行。
# ★ 交付闸（`check:artifacts`）在 `web` 里照常跑 —— 数据 PR 的"产物必须与账本同批"
#   正是那条闸在管，一条都不能省。

name: ci

on:
  pull_request:
  push:
    branches: [main]

# 同一分支连续 push 时取消上一次，省额度也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 全历史：产物边界那道闸要比 `<base>...HEAD`（浅克隆里 base 不存在，
          # 它会红着报"读不出变更清单"—— 那不是误报，而是白跑一趟）
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # npm ci 会触发 prepare（scripts/setup-hooks.mjs）。
      # 那个脚本的第一条约束就是"任何情况下都不能让 npm install 失败"，这一步顺带天天在验它。
      - run: npm ci

      # 与本地同一入口：node scripts/check/run.mjs web。
      # 本地跑 `npm run check:web` 绿，CI 不应再因为同一条检查红。
      - name: 检查（web，与本地同一入口）
        run: npm run check:web
        env:
          CHECK_BASE: origin/${{ github.base_ref || 'main' }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

  rust:
    name: rust
    # macOS 而不是 ubuntu：Tauri 的 Rust 侧在 Linux 上要先装 libwebkit2gtk 等一串系统包，
    # 而本产品只发 macOS。跑在目标平台上，CI 绿才等于"我这台机器上也能编"。
    # 公开仓库的 macOS runner 不计费，所以这个选择不花钱。
    runs-on: macos-latest
    # **在仓库根跑，不在 `src-tauri` 里跑。** 建了 workspace（b04 Task 13）之后，
    # virtual manifest 的默认成员就是全部成员 —— 在根上跑，`fmt --all` /
    # `clippy --all-targets` / `test` 的覆盖面会自动跟着长；在成员目录里跑则只覆盖那一个包。
    # 代价是 `--features` 在 virtual 根上不合法，工作台那两条要带 `-p` 指定包。
    steps:
      - uses: actions/checkout@v5
        with:
          # 变更分类要比 `base...HEAD`（浅克隆里 base 不存在 ⇒ 判定退化成"全跑"，
          # 白等一场 —— 那不是误报，是白跑）
          fetch-depth: 0

      - name: 变更分类（数据发布不陪跑编译）
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "拿不到基线 ⇒ 按代码变更处理（宁可多跑，不放行）"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          # 数据面：交付目录 / 文档 / 图片。**其余一切都算代码**（含 .github 与 scripts）
          rest=$(printf '%s\n' "$files" | grep -vE '^(presets/delivery/|docs/)|\.(md|png|jpe?g|gif|svg|webp)$' || true)
          if [ -z "$rest" ]; then
            echo "code=0" >> "$GITHUB_OUTPUT"
            echo "只动交付产物 / 文档 ⇒ 跳过 Rust 编译与测试"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "有代码变更 ⇒ 跑全套"
          fi

      # runner 自带 rustup，不引第三方 action —— 少一个供应链入口
      - name: 准备工具链
        if: steps.scope.outputs.code == '1'
        run: |
          # 版本锁在 `rust-toolchain.toml`（仓库根）：本地与 CI 必须是同一个 clippy，
          # 否则"本地绿、CI 红"是必然 —— 新版本会加 lint，推前闸用的是本地那个更宽松的。
          # `rustup show` 在目录里读到 toolchain 文件就按它安装；这里不再写死 `stable`。
          rustup show
          rustup component add clippy rustfmt
          rustc -V && cargo -V

      - name: 缓存 cargo registry 与 target
        if: steps.scope.outputs.code == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 与本地同一入口：node scripts/check/run.mjs rust。
      # 含 fmt / 两组 clippy / 两组 test / 寻址立法扫描；本地 `npm run check:rust` 绿，
      # CI 不应再因为同一条检查红。
      - name: 检查（rust，与本地同一入口）
        if: steps.scope.outputs.code == '1'
        run: npm run check:rust

  # Windows 侧单独一个 job，**不并进 rust 的 matrix**：
  # matrix 会把 job 名变成 `rust (macos-latest)`，而 ruleset 里的必需检查叫 `rust` ——
  # 改名等于那条必需检查永远等不到，PR 再也合不进去。
  #
  # 存在的理由：`src-tauri/tauri.windows.conf.json`（decorations: false + 自绘窗口键）
  # 与那几段 `#[cfg(not(target_os = "macos"))]` 在 macOS 上一行都不会被编译，
  # 等于完全没验证过。开发会在 Windows 上进行，这一档就是那边的编译保险。
  rust-windows:
    name: rust-windows
    runs-on: windows-latest
    # 同 `rust`：在仓库根跑，覆盖全部成员（理由写在那边）。
    steps:
      - uses: actions/checkout@v5
        with:
          # 同 `rust`：变更分类要比 `base...HEAD`
          fetch-depth: 0

      - name: 变更分类（数据发布不陪跑编译）
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "拿不到基线 ⇒ 按代码变更处理（宁可多跑，不放行）"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          rest=$(printf '%s\n' "$files" | grep -vE '^(presets/delivery/|docs/)|\.(md|png|jpe?g|gif|svg|webp)$' || true)
          if [ -z "$rest" ]; then
            echo "code=0" >> "$GITHUB_OUTPUT"
            echo "只动交付产物 / 文档 ⇒ 这台 Windows runner 不做编译"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "有代码变更 ⇒ 跑全套"
          fi

      - name: 准备工具链
        if: steps.scope.outputs.code == '1'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -V
          cargo -V

      - name: 缓存 cargo registry 与 target
        if: steps.scope.outputs.code == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 与本地同一入口：node scripts/check/run.mjs rust-windows。
      # 含 fmt / 两组 clippy / 两组 test / 寻址扫描 / Windows 安装器独立 crate。
      # 本地 `npm run check:rust-windows` 绿，CI 不应再因为同一条检查红。
      - name: 检查（rust-windows，与本地同一入口）
        if: steps.scope.outputs.code == '1'
        run: npm run check:rust-windows
