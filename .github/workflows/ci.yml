# CI —— 第一个 PR 之前就要存在的那层。
#
# 两个 job 的名字是 `web` 与 `rust`，必须和 scripts/setup-ruleset.mjs 里的
# REQUIRED_CHECKS 逐字对上（Task 16 把它们挂成必需检查）。改名等于把闸门拆了。
#
# 早先这里有一段"探测 + 跳过"的逻辑，用来在前端 / Rust 侧还没搬进来的阶段放行。
# 现在两边都在了，那段整个删掉 —— "允许跳过"与试验场那七道空转的闸是同一个失效模式，
# 留着一天就有一天会骗过人。
#
# ## 2026-11-05：数据发布不陪跑 Rust 编译
#
# 「发布一批预设」改的是 `presets/delivery/` 下的产物字节：没有一行 Rust，没有一行 TS。
# 让它等 macOS + Windows 两套 clippy/test，是在用错闸门（作者："为什么就发布一个预设，
# 他就要走这么完整的 PR"）。所以每个重 job 先做一次**变更分类**：
#
# · 只动交付产物 / 文档 ⇒ 跳过编译与测试，job 仍以 success 收尾；
# · 有任何代码变更（`src/`、`src-tauri/`、`scripts/`、`.github/`、`Cargo.*` …）⇒ 全套照跑。
#
# ★ **不能**用 workflow 级的 `paths` 过滤：那样 workflow 根本不触发，
#   而 ruleset 要求的 `rust` / `rust-windows` 是**必需检查**——检查永远不出现，
#   PR 就永远合不了。必须让 job 跑起来、只是不做重活。
# ★ 判定拿不到基线（首次 push / 全 0 的 before）时**按代码变更处理**：宁可多跑，不放行。
# ★ 交付闸（`check:artifacts`）在 `web` 里照常跑 —— 数据 PR 的"产物必须与账本同批"
#   正是那条闸在管，一条都不能省。

name: ci

on:
  pull_request:
  push:
    branches: [main]

# 同一分支连续 push 时取消上一次，省额度也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 全历史：产物边界那道闸要比 `<base>...HEAD`（浅克隆里 base 不存在，
          # 它会红着报"读不出变更清单"—— 那不是误报，而是白跑一趟）
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # npm ci 会触发 prepare（scripts/setup-hooks.mjs）。
      # 那个脚本的第一条约束就是"任何情况下都不能让 npm install 失败"，这一步顺带天天在验它。
      - run: npm ci

      # 版本号：已发布的号永不再用；开发版本必须是下一个号的 `-dev`
      # （2026-11-04 作者裁定。发布 = 去掉 -dev + 打不可变 tag；发完立刻 next）。
      - name: 版本号（已发布号不许再用）
        run: npm run version:check

      - name: eslint + stylelint
        run: npm run lint

      - name: 类型检查
        run: npx tsc -b

      - name: 构建
        run: npm run build

      # 判据 1（DATA-ARCHITECTURE.md §5）：铁律不许只写在文档里。扫客户端构建产物，
      # 开发源 TOML / 模拟数据 / 工作台内容出现即红。只对客户端构建跑——
      # 工作台构建故意带那些东西，不在本判据管辖内
      - name: 安装包产物扫描
        run: npm run check:bundle

      # 判据 2（DATA-ARCHITECTURE.md §5 第 2 条）：启动零网络。
      # 扫源码而不是产物：要看的是"程序起来那一刻动没动网络"，那是代码形状的问题，
      # 产物里问不出来。三道闸——网络符号只许住在 runtime/net.rs、启动段零联网、
      # 前端不许绕过 IPC 自己发 HTTP
      - name: 启动零网络扫描
        run: npm run check:zero-network

      # 判据：Rust 侧要求的 Channel 参数，前端必须真的挂上一条（2026-10-06 首页
      # 「下载并应用」死路）。Tauri 的 Channel 没有 Deserialize ⇒ 必填参数 ⇒
      # 契约里的"onTick 可选"只能在 bridge 兑现；不兑现时命令体一行都不跑，
      # 界面只拿到兜底的「出了点问题，请重试」。编译期抓不到、mock 那条路也不经过。
      - name: Channel 参数扫描
        run: npm run check:channel-args

      # 资源寻址 M6 判据（`docs/RESOURCE-ADDRESSING-ROADMAP.md` §5-M6）：
      # 0.0.6 起 release.json 的下载地址一律来自 Gitee Release（发布仓库），
      # 禁止 github.com/.../releases。v≤0.0.5 是断代前的历史记录，照旧合法。
      - name: 软件发布源扫描（断代后禁 GitHub Releases）
        run: npm run check:release-source

      # 判据：**开发时生成的东西不许混进正式交付**（作者 2026-10-28）。
      # `.gitignore` 里那句「`presets/delivery/` 只由发布命令动它」一直只是注释 ——
      # 这一条把它变成机器闸：交付目录变了却没写发布账本 = 这批字节不是发出来的；
      # 内核产物（`crates/preset/assets/presets/*`、`catalog.generated.json`）变了
      # 却没有源变更 = 测试残留。本地 pre-push 跑同一份脚本，这里兜住 `--no-verify`。
      # checkout 要全历史：`<base>...HEAD` 才比得出来。
      - name: 产物边界（开发产物不许进正式交付）
        run: npm run check:artifacts -- --base "origin/${{ github.base_ref || 'main' }}"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  rust:
    name: rust
    # macOS 而不是 ubuntu：Tauri 的 Rust 侧在 Linux 上要先装 libwebkit2gtk 等一串系统包，
    # 而本产品只发 macOS。跑在目标平台上，CI 绿才等于"我这台机器上也能编"。
    # 公开仓库的 macOS runner 不计费，所以这个选择不花钱。
    runs-on: macos-latest
    # **在仓库根跑，不在 `src-tauri` 里跑。** 建了 workspace（b04 Task 13）之后，
    # virtual manifest 的默认成员就是全部成员 —— 在根上跑，`fmt --all` /
    # `clippy --all-targets` / `test` 的覆盖面会自动跟着长；在成员目录里跑则只覆盖那一个包。
    # 代价是 `--features` 在 virtual 根上不合法，工作台那两条要带 `-p` 指定包。
    steps:
      - uses: actions/checkout@v5
        with:
          # 变更分类要比 `base...HEAD`（浅克隆里 base 不存在 ⇒ 判定退化成"全跑"，
          # 白等一场 —— 那不是误报，是白跑）
          fetch-depth: 0

      - name: 变更分类（数据发布不陪跑编译）
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "拿不到基线 ⇒ 按代码变更处理（宁可多跑，不放行）"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          # 数据面：交付目录 / 文档 / 图片。**其余一切都算代码**（含 .github 与 scripts）
          rest=$(printf '%s\n' "$files" | grep -vE '^(presets/delivery/|docs/)|\.(md|png|jpe?g|gif|svg|webp)$' || true)
          if [ -z "$rest" ]; then
            echo "code=0" >> "$GITHUB_OUTPUT"
            echo "只动交付产物 / 文档 ⇒ 跳过 Rust 编译与测试"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "有代码变更 ⇒ 跑全套"
          fi

      # runner 自带 rustup，不引第三方 action —— 少一个供应链入口
      - name: 准备工具链
        if: steps.scope.outputs.code == '1'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -V && cargo -V

      - name: 缓存 cargo registry 与 target
        if: steps.scope.outputs.code == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 格式
        if: steps.scope.outputs.code == '1'
        run: cargo fmt --all -- --check

      # --all-targets 让测试代码也过 clippy；clippy.toml 的 disallowed-methods 在这里生效。
      #
      # **两种 feature 组合都要跑。** 工作台是 `#[cfg(feature = "workbench")]` 门内的，
      # 不启用 feature 时那整棵子树**连编译都不会被碰** —— 于是它的写盘约束、
      # 它的 264 条判据，在 CI 里等于从来没有被检过。这不是覆盖率的小数点问题，
      # 而是唯一会写 `presets/`（用户数据）的那棵树整个不在场。
      - name: clippy（默认 feature）
        if: steps.scope.outputs.code == '1'
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy（workbench）
        if: steps.scope.outputs.code == '1'
        run: cargo clippy --all-targets -p mkp-support-ease --features workbench -- -D warnings

      - name: 测试（默认 feature）
        if: steps.scope.outputs.code == '1'
        run: cargo test

      - name: 测试（workbench）
        if: steps.scope.outputs.code == '1'
        run: cargo test -p mkp-support-ease --features workbench

      # 资源寻址立法（`docs/RESOURCE-ADDRESSING-ROADMAP.md` §6.4）：
      # ① 拼接越界 —— join_url 只许住在 runtime/resolver（模块可见性是墙，这条 grep
      #    是绊线：谁把拼接函数挪出去/抄一份，这里红）；② 交付面禁止绝对 URL ——
      #    source.json 是双镜像（GitHub/Gitee）共用的寻址规则声明，写死任何一家
      #    的绝对地址等于把另一家镜像的用户指回去。真正的逐条对账由发布闸
      #    ⑯（client/url-reconciliation，直调生产 Resolver）与 Golden Fixture 负责。
      - name: 寻址立法扫描（拼接越界 + 交付面无绝对 URL）
        run: |
          if grep -rnE 'join_url\s*\(' src-tauri/src --include='*.rs' | grep -v 'runtime/resolver' | grep -vE '^[^:]+:[0-9]+:\s*(//|///)'; then
            echo "::error::路径拼接跑出了 runtime/resolver —— 寻址唯一出口在 resolver 模块"
            exit 1
          fi
          if grep -E 'https?://' presets/delivery/source.json; then
            echo "::error::交付面（source.json）禁止绝对 URL —— 双镜像共用同一份寻址声明"
            exit 1
          fi

  # Windows 侧单独一个 job，**不并进 rust 的 matrix**：
  # matrix 会把 job 名变成 `rust (macos-latest)`，而 ruleset 里的必需检查叫 `rust` ——
  # 改名等于那条必需检查永远等不到，PR 再也合不进去。
  #
  # 存在的理由：`src-tauri/tauri.windows.conf.json`（decorations: false + 自绘窗口键）
  # 与那几段 `#[cfg(not(target_os = "macos"))]` 在 macOS 上一行都不会被编译，
  # 等于完全没验证过。开发会在 Windows 上进行，这一档就是那边的编译保险。
  rust-windows:
    name: rust-windows
    runs-on: windows-latest
    # 同 `rust`：在仓库根跑，覆盖全部成员（理由写在那边）。
    steps:
      - uses: actions/checkout@v5
        with:
          # 同 `rust`：变更分类要比 `base...HEAD`
          fetch-depth: 0

      - name: 变更分类（数据发布不陪跑编译）
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "拿不到基线 ⇒ 按代码变更处理（宁可多跑，不放行）"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          rest=$(printf '%s\n' "$files" | grep -vE '^(presets/delivery/|docs/)|\.(md|png|jpe?g|gif|svg|webp)$' || true)
          if [ -z "$rest" ]; then
            echo "code=0" >> "$GITHUB_OUTPUT"
            echo "只动交付产物 / 文档 ⇒ 这台 Windows runner 不做编译"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "有代码变更 ⇒ 跑全套"
          fi

      - name: 准备工具链
        if: steps.scope.outputs.code == '1'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -V
          cargo -V

      - name: 缓存 cargo registry 与 target
        if: steps.scope.outputs.code == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # ★ **2026-10-07 起这一档也跑 `workbench`**：它原来刻意不跑，理由是
      #   `src/workbench/**` 里没有平台编译分支（在 Windows 上再跑一遍得不到新信息，
      #   只多花一份 runner）。**那条理由到期了** —— 软件发布那一刀按宿主分流：
      #   `release_tx.rs` 的 `installer_plan()`（macOS → dmg / Windows → NSIS）、
      #   `npm_build()`（`npm` 在 Windows 上必须过一层 `cmd /C`，否则"程序找不到"）、
      #   应用内更新的 `.app.zip` 只有 macOS 有。这几段在 macOS 上一行都不会被编译，
      #   **只有这里能替它们把关**。当初那句"哪天工作台里出现了平台分支，这里要跟着加上"
      #   就是这条改动的由来。
      - name: clippy（默认 feature）
        if: steps.scope.outputs.code == '1'
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy（workbench）
        if: steps.scope.outputs.code == '1'
        run: cargo clippy --all-targets -p mkp-support-ease --features workbench -- -D warnings

      - name: 测试（默认 feature）
        if: steps.scope.outputs.code == '1'
        run: cargo test

      - name: 测试（workbench）
        if: steps.scope.outputs.code == '1'
        run: cargo test -p mkp-support-ease --features workbench
