<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupportEase</title>
    <!--
      引导窗口（`?guide=1`，Rust 侧 `ipc::guide::guide_show` 现开的那一扇）用的是**同一个
      index.html**。它只有一张 354×180 的小卡，不该看见主窗口那具骨架 —— 这里在样式表
      之前先把判据挂到 `html` 上（`main.tsx` 里那一句是模块加载之后才跑的，太晚）。
    -->
    <script>
      if (new URLSearchParams(location.search).get('guide') === '1') {
        document.documentElement.dataset.guide = '1'
      }
    </script>
    <!--
      ★★ **首屏骨架（2026-10-19）** —— 为什么写在 index.html 里、而不是 React 组件：

      窗口一出现，WebView 拿到的是这份 HTML；`#root` 原来是空的，于是从"窗口出现"到
      "React 挂上第一帧"之间**整扇窗是白的**。dev 模式下这段要等 Vite 把模块图逐个
      transform 完（Windows 上还要叠上 watcher / Defender 的 IO），几秒到几十秒都有。

      把骨架直接写进 HTML，**不经过任何 JS / CSS Module / IPC**：窗口出现即有内容。
      React 的 `createRoot(...).render()` 第一次提交会清空容器里的东西，骨架随真实界面
      一起退场，不需要任何卸载代码。

      样式全内联、颜色只跟随**系统**深浅：这一屏比 `tokens.css` 到得早，读不到用户
      在应用里选的那一档（"深色主题 + 浅色系统"时骨架会浅一档，属于可接受的过渡）。
      不写任何假数据/假文案：灰条就是灰条，与 `app/home/Skeleton` 同一条规矩。
    -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      html {
        background: linear-gradient(135deg, #f7f9fa 0%, #eceff1 100%);
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif;
        background: linear-gradient(135deg, #f7f9fa 0%, #eceff1 100%);
        overflow: hidden;
      }

      #boot {
        --boot-surface: #fbfcfd;
        --boot-line: rgba(16, 24, 32, 0.09);
        --boot-line-strong: rgba(16, 24, 32, 0.16);
        --boot-text: #1a2128;

        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        overflow: hidden;
      }

      /* ---- 顶栏：与 TopTabs 同高（--titlebar-h = 38px）---- */
      #boot .boot-bar {
        height: 38px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 16px;
        border-bottom: 1px solid var(--boot-line);
        box-sizing: border-box;
      }

      /* 字标是真的（它不是数据）；骨架里留它也让人一眼认出是哪一扇窗 */
      #boot .boot-logo {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--boot-text);
        flex: none;
        opacity: 0.75;
      }

      #boot .boot-tabs {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: 8px;
      }

      #boot .boot-tab {
        display: block;
        width: 30px;
        height: 10px;
        border-radius: 3px;
        background: var(--boot-line);
      }

      /* 当前页那一枚（首页）略实一点，页签条看起来才有"当前选中" */
      #boot .boot-tab.is-on {
        width: 38px;
        background: var(--boot-line-strong);
      }

      /* ---- 正文：一叠卡的占位 ---- */
      #boot .boot-body {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: clamp(16px, 3vh, 28px) clamp(16px, 4vw, 44px);
        box-sizing: border-box;
      }

      #boot .boot-card {
        flex: 1;
        max-width: 1040px;
        display: grid;
        grid-template-columns: minmax(180px, 240px) 1fr;
        gap: 20px;
        padding: 20px;
        border-radius: 16px;
        background: var(--boot-surface);
        box-shadow: 0 1px 2px rgba(16, 24, 32, 0.05);
        box-sizing: border-box;
      }

      /* 左列 = 机型 / 版本那一栏 */
      #boot .boot-side {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-right: 16px;
        border-right: 1px solid var(--boot-line);
      }

      /* 右列 = 向导卡：标题 + 内容块 + 底部两颗按钮 */
      #boot .boot-main {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }

      #boot .boot-plate {
        flex: 1;
        min-height: 120px;
        border-radius: 12px;
        background: var(--boot-line);
        opacity: 0.55;
      }

      #boot .boot-foot {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      #boot .boot-pill {
        width: 82px;
        height: 28px;
        border-radius: 999px;
        background: var(--boot-line);
      }

      #boot .boot-pill.is-primary {
        background: var(--boot-line-strong);
      }

      #boot .boot-line {
        display: block;
        height: 10px;
        border-radius: 4px;
        background: var(--boot-line);
      }

      #boot .boot-line.h14 {
        height: 14px;
      }

      #boot .boot-line.w40 { width: 40%; }
      #boot .boot-line.w55 { width: 55%; }
      #boot .boot-line.w70 { width: 70%; }
      #boot .boot-line.w86 { width: 86%; }

      /* 呼吸：与两处骨架屏同一个节奏（1.4s 起落），别闪 —— 闪烁比静止更累眼 */
      @keyframes boot-pulse {
        0%,
        100% { opacity: 1; }
        50% { opacity: 0.45; }
      }

      #boot .boot-tab,
      #boot .boot-line,
      #boot .boot-plate,
      #boot .boot-pill {
        animation: boot-pulse 1.4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .boot-tab,
        #boot .boot-line,
        #boot .boot-plate,
        #boot .boot-pill {
          animation: none;
          opacity: 0.7;
        }
      }

      @media (max-width: 640px) {
        #boot .boot-card {
          grid-template-columns: 1fr;
        }

        #boot .boot-side {
          border-right: 0;
          padding-right: 0;
          border-bottom: 1px solid var(--boot-line);
          padding-bottom: 14px;
        }
      }

      /* 引导窗口不显示这具骨架（见 head 里那段脚本） */
      html[data-guide] #boot {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: linear-gradient(135deg, #1c1c1c 0%, #151515 100%);
        }

        #boot {
          --boot-surface: #232323;
          --boot-line: rgba(255, 255, 255, 0.09);
          --boot-line-strong: rgba(255, 255, 255, 0.16);
          --boot-text: #e8eaec;
        }

        #boot .boot-card {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="界面正在加载">
        <div class="boot-bar">
          <span class="boot-logo">MKP</span>
          <span class="boot-tabs" aria-hidden="true">
            <i class="boot-tab is-on"></i>
            <i class="boot-tab"></i>
            <i class="boot-tab"></i>
            <i class="boot-tab"></i>
            <i class="boot-tab"></i>
            <i class="boot-tab"></i>
          </span>
        </div>
        <div class="boot-body" aria-hidden="true">
          <div class="boot-card">
            <div class="boot-side">
              <i class="boot-line w70 h14"></i>
              <i class="boot-line w86"></i>
              <i class="boot-line w86"></i>
              <i class="boot-line w55"></i>
            </div>
            <div class="boot-main">
              <i class="boot-line w40 h14"></i>
              <i class="boot-line w70"></i>
              <div class="boot-plate"></div>
              <div class="boot-foot">
                <i class="boot-pill"></i>
                <i class="boot-pill is-primary"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
