# 全仓只允许写明理由的那几处直接写盘。
#
# **这份文件住在仓库根**（b04 写盘纪律补齐 / Task 4）。原来它在 `src-tauri/` 下，
# 于是 `crates/postprocess` 与 `crates/preset` 两个成员**完全不受管** ——
# 而迁进来的 preset 有一处直接写 `presets/` 真源，没有任何机器拦得住它。
#
# ## clippy.toml 的查找规则：**就近优先，不合并**（两次探针实测，不是查文档）
#
# - 根上放一份、禁 `std::fs::write` ⇒ `crates/*` **被管**（报出命中）；
# - 根上那份改成禁 `std::fs::read_to_string`（`src-tauri` 里到处在用）
#   ⇒ `src-tauri` **零命中** —— 因为那时它自己还有一份，就近赢了。
#
# 也就是说：**任何成员一旦自带 `clippy.toml`，就会整份屏蔽这里的规则**，
# 而且不会有任何警告。往后要给某个成员放宽，别新建 crate 级的 `clippy.toml`
# （那会把这里的 5 条一起丢掉）—— 用 `#[allow]` 逐处写理由。
#
# ## 另一个坑：`cargo clippy` 会跳过未变更的 crate
#
# 改完这份文件直接跑 `cargo clippy`，拿到的命中清单是**假的**：实测先报 9 处、
# 且 `postprocess` 一处都没有；`cargo clean -p mkpse-preset -p mkpse-postprocess`
# 之后重跑是 15 处。**改禁列之后必须先 clean 再验。**
#
# 为什么用 clippy 而不是"约定 + code review"：这条纪律的失效是静默的 ——
# 某天顺手写一行 std::fs::write，一切正常，直到用户在保存时断电。
# 机器拦得住的事情不该靠记性。
#
# 逃生口（每一处都在代码里写了理由与**退役条件**）：
# - `src-tauri/src/fsx/atomic.rs`：唯一的统一写盘入口；
# - `crates/postprocess/src/pipeline/mod.rs` `write_atomic`：`.part` + rename；
# - `crates/postprocess/src/main.rs` `cmd_init`：先判 exists 再写，写的是 CLI 指定的路径；
# - `crates/preset/src/generate.rs` `write_all` / `sync_baseline`：开发工具产物与判据基线
#   （后者是全仓唯一能改内核判据期望值的写盘点，另有落点断言）；
# - `crates/preset/src/registry_edit.rs` `write_atomic`：`.writing` + rename，写真源，三道闸；
# - `crates/*/tests/**` 与 `#[cfg(test)]`：测试写临时文件是正当的，这条纪律管生产代码。
#
# 禁的是**会截断已有文件**的那几个入口。前三条是直接入口，后两条是"拿到写句柄"
# 的闸门 —— 闸门不关的话，前三条禁了也能绕过去。b04 Task 13 盘点实测：
# 这个洞一直存在（`OpenOptions::new().create(true).write(true)` 不在禁列里），只是没人踩。
disallowed-methods = [
  { path = "std::fs::write", reason = "会先把目标文件截断再写，崩溃时留半个文件。用 fsx::atomic::atomic_write" },
  { path = "std::fs::File::create", reason = "同上。要写盘走 fsx::atomic" },
  { path = "tokio::fs::write", reason = "同上。要写盘走 fsx::atomic" },
  { path = "std::fs::File::options", reason = "它返回 OpenOptions，是绕开上面三条的闸门。要写盘走 fsx::atomic" },
  { path = "std::fs::OpenOptions::new", reason = "另一条同样的闸门。要表达「要么建出来、要么已存在就失败」用 File::create_new（见下）" },
]

# **刻意不禁 `std::fs::File::create_new`。**
#
# 它带 `create_new(true)`：路径已存在就失败，**不可能截断任何已有文件**。它是
# "原子地占住一个新路径"的唯一原语，而 `fsx::atomic::atomic_write` 的 rename 会**覆盖**，
# 表达不了这个语义 —— `presets::catalog::add_machine` 正是靠它避免覆盖一台已存在的机型
# （那次覆盖不可逆）。禁掉它等于把那条路逼回"先 stat 再写"的窗口里。
#
# 它留下的唯一风险是"占住了路径但还没写内容时挂掉 ⇒ 0 字节文件"。那与"半个文件"
# 不同：内容是后一次原子写进去的，而这一点在 `add_machine` 的文档里写着。
