path = 'guides/open-with-dark.rendered.webp'
delivery = 'bundled'

# ==================== 分组（`[[groups]]` · 2026-10-16） ====================
#
# **一组图** = 共用同一份标注源稿的那几张（作者：「用同样的框的就是一组」，要"套装的感觉"）。
#
# 从前"哪几张是一组"是**从文件名算**的（抹掉 `-light` / `-dark` 后缀）。现在它是一条登记：
# 跟资产一样入库、跟仓库走、编进 catalog —— 由工作台「资产库」页的分组管理器维护
# （作者：「不能只用文件名去实现，必须有一个去管理它，像那个 catalog 那种的」）。
#
# 三条硬规矩（加载期就拦，见 `presetdata::assets::check_groups`）：
#   ① 同一组的成员必须**在同一个目录** —— 源稿落点 = `<成员所在目录>/<组 id>.anno.json`；
#   ② 一张资产**至多属于一个组** —— 否则"它跟谁共用一份标注"有两种答案；
#   ③ `id` 同时就是那份源稿的**文件名**，所以得是个安全的名字（无 `/`、无 `..`）。
#
# 没登记的图不受影响：它仍按旧口径（抹掉浅深后缀）单独成一份源稿 —— 只是那份的落点
# 会跟着文件名走。真在意稳定，就给它建个组。
#
# `role` 是"这张在这个组里演什么"（客户端按主题挑 `light` / `dark`）。**可以空**。
# ★ 客户端**不认文件名**：它读 catalog 里的这张组表，按 `role` 挑图。

[[groups]]
id = 'open-with'
name = '「改 .3mf 默认打开方式」引导图'

[[groups.members]]
asset = 'guide-open-with-light'
role = 'light'

[[groups.members]]
asset = 'guide-open-with-dark'
role = 'dark'

