# 资产域①层：**一份集中定义**（b05 Task 8）。
#
# 这里登记我们管的资产：图片 / 图标 / 模型 / 切片器预设（BBS）四类。
# **文件本体不在这里** —— 它们在资产根 `<repo>/public/assets/` 下，条目里的 `path`
# 就是相对那个根的一段（前端按 `/assets/<path>` 取）。
#
# 为什么一份文件而不是一资产一文件：旧仓 `source/assets/*.toml` 是 18 份、一资产一文件，
# 加一张图就要新建一个文件，而"这批资产都属于 A1"这句话在目录里看不出来（doc §8）。
# 门槛：超过 20 个条目再拆（doc §8）。
#
# **这里不写什么**：
# - 不写 `fileName`：路径只有 `path` 一处（旧仓同时存 `fileName` 与 `relativePath`）
# - 不写 `sha256` / `size`：那是**交付物**的属性，发布时按真实字节算（Task 13.6）
# - **不给 MKP 预设建条目**：它的路径由命名规则算出（doc §12.5），登记一份就是冗余
#
# 一条的形状（`type` 取值：`image` | `icon` | `model` | `slicerProfile`）：
#
#   [[assets]]
#   id = 'a1-image'                   # 主键，**大小写不敏感**唯一
#   type = 'image'
#   machineId = 'A1'                  # 归属机型；不属于任何机型时整行省略
#   name = 'A1 外观图'                # 给人看的名字
#   path = 'printers/bambu/a1.webp'   # 相对资产根，不许越界（拒绝对路径与 `..`）
#
# 切片器预设多两项（G-3：切片器是**开放的扩展维度**，今天只有 bbs）：
#
#   [[assets]]
#   id = 'a1-bbs-02-010'
#   type = 'slicerProfile'
#   machineId = 'A1'
#   name = 'A1 0.2 喷头 0.10 层高'
#   path = 'bbs/A1/MKPProcess A1 0.2 0.10.json'
#   slicer = 'bbs'
#   profile = 'process'               # 该切片器下的档位（旧仓的 category）
#
# **现在是空的**：条目与文件一起在 b05 Task 9 落地（搬运 + 登记 + 改机型引用）。
# 空不等于可以没有这个文件 —— 它是资产域①层的定义文件，加载期会读它。
