# ---------------- 模型 ----------------
#
# 名字与预览图**暂缓**（裁决 2026-09-24）：旧仓那 8 张预览图按 D-4 没迁，
# 所以这里只有三份模型本体，`name` 取的是源文件语义而不是"模型库里的标题"。
# 文件名沿用旧仓那套（`.3mf`；同一份的 `.zip` 与解压目录**不重复交付**，见 Task 7.4）。

[[assets]]
id = 'mkp-support-test-models'
type = 'model'
name = 'MKP 支撑测试模型（多模型拼盘）'
path = 'models/MKP_support_test_models.3mf'

[[assets]]
id = 'precise-calibration'
type = 'model'
name = '精密校准模型'
path = 'models/Precise_Calibration.3mf'

[[assets]]
id = 'zoffset-calibration'
type = 'model'
name = 'Z 轴偏移校准模型'
path = 'models/ZOffset_Calibration.3mf'

# ---------------- 切片器预设（BBS） ----------------
#
# 路径沿用旧仓那套目录与文件名（`Process/0.2mm/…`）—— **文件名没改**：
# 它是消费端（BBS 侧）一直在用的名字，改名要单独定规则（Task 12 再谈），
# 而 **asset id 才是稳定键**。`slicer` 是 G-3 留的开放维度，`profile` 是档位。

