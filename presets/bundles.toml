# 套餐域①层：**一份集中定义**（b05 Task 10）。
#
# # 套餐是什么
#
# **套餐 = 配发的 MKP 预设 + 配发的 BBS 引用**。两类都走资产库（`assetRefs` 一份清单）：
# MKP 预设 2026-10-03 起也在资产库里（`type = 'mkPreset'`，`machineId` + `versionId`
# 定位那一版，文件是生成产物、不写 path）—— 套餐从资产库统一选配发内容。
#
# # 一版一套（2026-10-03，作者裁决：套餐照 C15 模型重排）
#
# **一个版本一份套餐**：`{机型}_{版本}`（单版本机型沿用 `_default` 旧写法 ——
# 那是它们一直以来的名字，机型文件里引用着）。旧数据五台机型各一份套餐、
# A1 / A1_MINI 三个版本共用一份（「1 个文件 3 个版本」），
# 与第二仓 C15 模型「9 份套餐 · 每份 2 个文件 1 个版本」对不上 —— 照模型重排：
#
#   A1_STANDARD / A1_FAST / A1_FASTV3.3       = a1-{standard,fast,fastv3.3} + a1-bbs-04-020
#   A1_MINI_STANDARD / A1_MINI_FAST / …       = a1_mini-{…} + a1_mini-bbs-04-020
#   P1S_default / P2S_default / X1C_default   = {p1s-lite, p2s-standard, x1c-lite} + 各自 BBS
#
# BBS 取各机型 **0.4 喷头**那一份（0.4 是默认喷头；与旧数据五份套餐装的同一批）。
# `updatedAt` 盖 `2026-10-03`：这次是**真改了套餐**（从五份并装改成九份各装），
# 不是搬文件。
#
# # 为什么 `assetRefs` 不能没有 BBS
#
# MKP 侧的 `use_ironing_path = true`（拿熨烫路径当涂胶路径）只在 BBS 侧
# `enable_support_ironing = "1"` 与那组 `support_ironing_*` 成立时才有意义。
# **发了 MKP 预设不发配套 BBS 预设，用户打出来的结果是错的**（doc §12.4）——
# 所以加载期就拦「套餐里一条 BBS 都没有」。
#
# # 字段
#
# - `id`：机型文件引用着它（`defaultBundle` 五处 + 每个版本的 `recommendedBundle`
#   一处）。**机型默认套餐 = 该机型的 STANDARD 版那份**（生成侧回退的口径）。
# - `display`：给人看的名字，沿用「官方推荐」。
# - `assetRefs`：**我们的资产 id**（MKP 预设类 + 切片器类混一份清单，前端按类型分组）。

# ---------------- A1：三个版本各一份 ----------------

[[bundles]]
id = 'A1_STANDARD'
display = '官方推荐'
machineId = 'A1'
assetRefs = ['a1-standard', 'a1-bbs-04-020']
updatedAt = '2026-10-03'

[[bundles]]
id = 'A1_FAST'
display = '官方推荐'
machineId = 'A1'
assetRefs = ['a1-fast', 'a1-bbs-04-020']
updatedAt = '2026-10-03'

[[bundles]]
id = 'A1_FASTV3.3'
display = '官方推荐'
machineId = 'A1'
assetRefs = ['a1-fastv3.3', 'a1-bbs-04-020']
updatedAt = '2026-10-03'

