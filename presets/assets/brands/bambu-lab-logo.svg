  <!--
    Bambu Lab 字标（深色底之外的那一版：浅色底用，深色字）。

    2026-10-03 从 `src/app/assets/bambuLogo.ts` 里的 data URI 抽成真文件
    （作者：品牌图片也应该正式进入资产体系 —— 图片文件是什么、在哪里、怎么交付由资产
    系统负责；谁使用这张图由品牌数据负责）。台账登记见 `presets/assets.toml` 的
    `bambu-lab-logo`，`brands.toml` 的 `logo` 引用它。

    **为什么是"深色"这一版**：原文件每个图元都挂 `fill="currentColor"`，为换色设计；
    而 `currentColor` 在 `<img src="...">` 里会失效（独立文档，解析不到外层 CSS 的 color），
    随包资产只能**一色**。实测当前界面只用深色一版（浅色底），所以就固化这一版；
    将来真出现深色底，那是**另一条资产**（`bambu-lab-logo-light`），不是"换个 fill"。

    转写口径：路径数据逐字节照抄原文件，一个坐标都没动。
