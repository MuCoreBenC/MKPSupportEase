# 结构签名 → 最低正式客户端版本（`docs/PUBLISH-ARCHITECTURE.md` §5.3）
#
# 这张表**是人工维护的**，这是设计的一部分：签名机器算得出来（`runtime::structure`），
# 而「这个结构变化要哪个客户端起才读得懂」是**产品决定**。
#
# ★ 规矩：**没有规则 = 不准发**。
#   发布闸 ⑫ 会拿当前结构签名来这里查；查不到就红着拦住发布，并把该登记的那一行
#   直接印在详情里（照抄、想清楚 minClient 填什么、再点发布）。
#
# ★ `minClient` 说的是「最低**正式**客户端版本」，**不要求这个版本已经发布**。
#   这正是 Dev 场景要的那条缝：本地代码已经支持新结构，正式安装包还没发出去 ——
#   这里就写那个**将要**发布的版本号；而 Dev 构建靠 `SUPPORTED_SIGNATURES`（结构能力）
#   放行，不看版本号。两者合起来才不会把自己锁死（§5.3 正文）。
#
# 什么时候要往这里加一条 = 结构签名变了。签名什么时候变：
#   必填字段增删、可选改必填、字段类型变（机器算得出来，`cargo test` 会红着告诉你）
#   路径语义 / asset kind 语义 / 客户端读取方式变（机器看不出来，靠
#   `runtime::structure::STRUCTURE_EPOCH` 人工 +1）

