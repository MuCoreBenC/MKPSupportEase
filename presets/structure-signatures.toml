note = '''
第一代结构（2026-10-04）。

`minClient` 写 0.0.1 是个事实陈述，不是偷懒：**这个项目还没有发布过任何正式客户端**
——`src-tauri/Cargo.toml`、`tauri.conf.json`、根 `package.json` 三处都是 0.0.1，也没有
发版流程。所以"读得懂这一代的最老正式版"就是它。

结构上这一代是**新起点**：`catalog.path` 的基准从 `mkp/…` 改成**发布根 `presets/`**
（第一刀，甲案）。那是一次**语义变化**——字段名与类型一个都没动，所以签名本身看不出它，
是 `STRUCTURE_EPOCH = 1` 把它记下来的（`runtime::structure` 的模块头讲了为什么必须有人签字）。

下一次结构变化时，这一条**不要改**：复制一份、换成新的签名，`minClient` 填那个**将要**
发布的版本号。历史条目留着——它记录的是"老客户端那时候读到的是哪一代"。
'''

