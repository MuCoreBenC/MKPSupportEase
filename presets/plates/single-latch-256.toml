# 一块打印板的顶视轮廓 —— 塔地图（TowerMap）的底衬。
#
# **这是一块独立的实体，不是机型的附属**：机型只引用板 id（`plateIds` / `defaultPlateId`），
# 几何住在这里。所以同一块板能被多台机型共用（A1 / P1S / P2S / X1C 就是同一块，
# 不再各写一份）；新板只要往这个目录里放一个文件。
#
# 坐标是板件自身的毫米：原点在板的**后缘左角**（y 向下指前缘）。`path` 含卡舌与把手，
# 孔洞子路径靠 evenodd 镂空；`bodyPath` 是不含卡舌 / 把手的板身（余量灰圈 = evenodd(板身, 可打印区)）。
#
# 数据来自 A43 试验台（mkp-adaptive-console）的 `bedOutlineA43.ts`（那里由
# `scripts/bed-outline.mjs` 从官方板件模型参数化重建，逐行扫描网格自检偏差 ≤2mm）。
# 本轮「直接把常量搬进 A」，不搬生成脚本与素材库。
#
# 【为什么要单独一个 frame 字段】机型 `[dimensions].bedSize` 是**涂胶 / 运动口径**
# （A1 记的是 260×255），真可打印区是这里（256×256）。塔地图必须活在可打印区里，
# 而那个口径不属于机型 —— 属于板。

id = 'single-latch-256'
name = '单卡舌 256'

# 板件外轮廓宽 / 深（viewBox 就是 0 0 w d）
w = 258.0
d = 276.0

bodyPath = 'M7.5,8.0L250.5,8.0A7.5,7.5 0 0 1 258.0,15.5L258.0,266.0L6.0,266.0A6.0,6.0 0 0 1 0.0,260.0L0.0,15.5A7.5,7.5 0 0 1 7.5,8.0Z'
path = 'M95.1,7.8L102.7,0.9A1.2,1.2 0 0 1 103.5,0.6L154.5,0.6A1.2,1.2 0 0 1 155.3,0.9L162.9,7.8A0.6,0.6 0 0 1 163.3,8.0L250.5,8.0A7.5,7.5 0 0 1 258.0,15.5L258.0,268.0A8.0,8.0 0 0 1 250.0,276.0L83.0,276.0A1.2,1.2 0 0 1 82.2,275.7L72.3,266.3A1.2,1.2 0 0 1 71.5,266.0L6.0,266.0A6.0,6.0 0 0 1 0.0,260.0L0.0,15.5A7.5,7.5 0 0 1 7.5,8.0L94.7,8.0A0.6,0.6 0 0 1 95.1,7.8ZM107.0,6.2L151.0,6.2L151.0,8.0L107.0,8.0L107.0,6.2ZM224.0,266.1L231.4,266.1L237.7,272.8L224.0,272.8L224.0,266.1ZM236.0,266.1L249.0,266.1L249.0,272.8L241.9,272.8L236.0,266.1Z'

[frame]
# 可打印区在轮廓坐标里的落点（mm）
x = 1.0
y = 8.5
w = 256.0
h = 256.0
