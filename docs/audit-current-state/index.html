<head>

<title>SupportEase 全仓库现状审计（2026-10-09）</title>
<style>
/* SupportEase 现状地图 —— 样式：浅色、克制、适合桌面阅读；信息密集处优先表格与折叠。 */

:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --line: #e3e6ea;
  --line-strong: #c9cfd6;
  --ink: #1c2430;
  --ink-2: #4b5563;
  --ink-3: #7b8695;
  --accent: #1f6feb;
  --ok: #1a7f43;
  --warn: #9a6700;
  --danger: #b42318;
  --code: #f2f4f7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}

a { color: var(--accent); }

header.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.topRow {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 12px 18px 8px;
}

.topRow h1 { margin: 0; font-size: 15px; }

#baseline { flex: 0 1 720px; min-width: 320px; }

#stats { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 10px; }

.stat {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--bg);
  font-size: 12px;
  color: var(--ink-2);
}

.stat strong { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 18px 10px;
  border-top: 1px solid var(--line);
}

.toolbar input[type="search"] {
  width: min(420px, 40vw);
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  font: inherit;
}

.toolbar select {
  height: 28px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background: var(--surface);
  font: inherit;
}

.toolbar button {
  height: 28px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background: var(--surface);
  font: inherit;
  cursor: pointer;
}

#count { color: var(--ink-3); font-variant-numeric: tabular-nums; }

.layout { display: flex; align-items: flex-start; gap: 18px; padding: 14px 18px 40px; }

.nav { position: sticky; top: 128px; display: flex; flex-direction: column; gap: 2px; width: 148px; flex: 0 0 148px; }

.navBtn {
  padding: 6px 10px;
  border: 0;
  border-radius: 3px;
  background: transparent;
  font: inherit;
  text-align: left;
  color: var(--ink-2);
  cursor: pointer;
}

.navBtn:hover { background: #eceff3; color: var(--ink); }
.navBtn.on { background: var(--accent); color: #fff; }

main#main { flex: 1; min-width: 0; }

.section { min-width: 0; }

.sub, .group { margin: 0 0 18px; }

.sub > h3, .grp > summary strong { font-size: 13px; }

h3 {
  margin: 0 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
}

.cap { margin: 10px 0 4px; font-size: 12px; color: var(--ink-3); }

details.grp { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); margin-bottom: 14px; }

details.grp > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  list-style: none;
}

details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: "▸"; color: var(--ink-3); }
details.grp[open] > summary::before { content: "▾"; }

.grpBody { padding: 4px 12px 12px; }

.rec {
  padding: 10px 12px;
  margin: 8px 0;
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong);
  border-radius: 4px;
  background: var(--surface);
}

.rec.k-problem { border-left-color: var(--danger); }
.rec.k-complexity { border-left-color: var(--warn); }
.rec.k-decision { border-left-color: var(--accent); }
.rec.k-conflict { border-left-color: var(--danger); }

.rec.flash { background: #fff8d6; }

.rhead { margin-bottom: 6px; }
.rtitle { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rid { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.rsub { margin-top: 2px; font-size: 12px; color: var(--ink-2); }

.badge { padding: 1px 6px; border-radius: 2px; font-size: 11px; border: 1px solid; }
.lv-confirmed { color: var(--ok); border-color: #b7e0c6; background: #f0fbf4; }
.lv-partial { color: var(--warn); border-color: #f0dca8; background: #fffaf0; }
.lv-unverified { color: var(--ink-2); border-color: var(--line-strong); background: var(--code); }
.lv-conflict { color: var(--danger); border-color: #f3c2bd; background: #fdf2f1; }

.vd-keep { color: var(--ok); border-color: #b7e0c6; background: #f0fbf4; }
.vd-merge { color: #0b5cad; border-color: #bcd6f5; background: #f0f6fe; }
.vd-drop { color: var(--danger); border-color: #f3c2bd; background: #fdf2f1; }
.vd-internalize { color: var(--ink-2); border-color: var(--line-strong); background: var(--code); }
.vd-redo { color: #7a4bc4; border-color: #d9c9f2; background: #f8f4fe; }
.vd-todo { color: var(--warn); border-color: #f0dca8; background: #fffaf0; }

table.kv { width: 100%; border-collapse: collapse; }
table.kv > tr, table.kv tr { vertical-align: top; }
table.kv th {
  width: 148px;
  padding: 3px 8px 3px 0;
  text-align: left;
  font-weight: 500;
  color: var(--ink-3);
  font-size: 12px;
  border-top: 1px solid var(--line);
}
table.kv td { padding: 3px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
table.kv tr:first-child th, table.kv tr:first-child td { border-top: 0; }

.chip {
  display: inline-block;
  margin: 1px 4px 1px 0;
  padding: 0 6px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--code);
  font-size: 11px;
  color: var(--ink-2);
}

.chip.req { color: var(--ok); border-color: #b7e0c6; background: #f0fbf4; }
.chip.vis { color: #0b5cad; border-color: #bcd6f5; background: #f0f6fe; }

.ev { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-top: 6px; }
.evLabel { font-size: 11px; color: var(--ink-3); }
.evItem { padding: 0 4px; background: var(--code); border: 1px solid var(--line); border-radius: 2px; font-size: 11px; font-family: var(--mono); }

.muted { color: var(--ink-3); }
.note { margin: 4px 0; font-size: 12px; color: var(--ink-2); }

pre.mermaid {
  margin: 4px 0;
  padding: 8px 10px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--code);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
}

details.field, details.inline { margin: 4px 0; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
details.field > summary, details.inline > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 8px; cursor: pointer; }
details.field > summary code { font-family: var(--mono); font-size: 12px; color: var(--ink); }
details.field > table.kv, details.inline > table.kv { padding: 0 8px 6px; }
details.field table.kv th, details.inline table.kv th { width: 108px; }

.textList { margin: 4px 0; padding-left: 20px; }
.textList li { margin: 2px 0; }

.linkBtn {
  margin: 1px 4px 1px 0;
  padding: 0 6px;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  background: var(--surface);
  font: inherit;
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
}

footer.foot { padding: 12px 18px 40px; color: var(--ink-3); font-size: 12px; }

</style>
</head>

/* --------------------------------------------------- 证据 / 字段渲染小件 */
function evidenceChips(list) {
    const box = el('div', { cls: 'ev' });
    box.append(el('span', { cls: 'evLabel', text: '证据' }));
    const arr = Array.isArray(list) ? list : list ? [list] : [];
    if (arr.length === 0) {
        box.append(el('span', { cls: 'muted', text: '（无）' }));
        return box;
    }
    for (const e of arr) {
        const s = String(e);
        // 只显示 路径::符号::行号；不做伪链接（仓库无可确定的公开浏览地址）
        box.append(el('code', { cls: 'evItem', text: s, title: s }));
    }
    return box;
}
function levelBadge(level) {
    const key = typeof level === 'string' ? level : '';
    if (!key || !LEVEL_LABEL[key])
        return null;
    const b = el('span', { cls: `badge lv-${key}`, text: LEVEL_LABEL[key] });
    b.title = DATA.meta.evidenceLevels[key] ?? key;
    return b;
}
function verdictBadge(verdict) {
    const key = typeof verdict === 'string' ? verdict : '';
    if (!key || !VERDICT_LABEL[key])
        return null;
    const b = el('span', { cls: `badge vd-${key}`, text: VERDICT_LABEL[key] });
    b.title = DATA.meta.verdicts[key] ?? key;
    return b;
}
/* pairs 用宽松的 Array<Array<unknown>>：调用处直接写数组字面量时不会被元组类型卡住 */
function kvTable(pairs, opts = {}) {
    const skip = new Set(['id', 'evidence', 'level', 'verdict', ...(opts.skip ?? [])]);
    const t = el('table', { cls: 'kv' });
    for (const pair of pairs) {
        const k = String(pair[0]);
        const v = pair[1];
        if (skip.has(k))
            continue;
        if (v === undefined || v === null)
            continue;
        const tr = el('tr');
        tr.append(el('th', { text: k }));
        tr.append(valueCell(v));
        t.append(tr);
    }
    return t;
}
function valueCell(v) {
    const td = el('td');
    if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') {
        td.textContent = String(v);
        return td;
    }
    if (Array.isArray(v)) {
        if (v.length === 0) {
            td.append(el('span', { cls: 'muted', text: '（空）' }));
            return td;
        }
        // 字符串数组 → 一行 chips；对象数组 → 折叠列表
        if (v.every((x) => typeof x === 'string' || typeof x === 'number')) {
            for (const x of v)
                td.append(el('span', { cls: 'chip', text: String(x) }));
            return td;
        }
        for (const x of v) {
            const d = el('details', { cls: 'inline' });
            const s = el('summary', { text: isPlainObject(x) && typeof x.id === 'string' ? String(x.id) : '一条' });
            d.append(s);
            if (isPlainObject(x))
                d.append(kvTable(Object.entries(x), { skip: ['id'] }));
            else
                d.append(el('span', { text: String(x) }));
            td.append(d);
        }
        return td;
    }
    if (isPlainObject(v)) {
        td.append(kvTable(Object.entries(v)));
        return td;
    }
    td.textContent = '—';
    return td;
}
/** 一条记录的通用头部：标题 + 徽章 + 副标题 */
function recordHead(r, title, sub) {
    const h = el('div', { cls: 'rhead' });
    const line = el('div', { cls: 'rtitle' });
    line.append(el('span', { cls: 'rid', text: idOf(r) }));
    line.append(el('strong', { text: title }));
    const lv = levelBadge(r.level);
    if (lv)
        line.append(lv);
    const vd = verdictBadge(r.verdict);
    if (vd)
        line.append(vd);

        h.append(el('div', { cls: 'rsub', text: sub }));
    return h;
}

/** 有些记录没有 id（生命周期步骤、链路步骤、localStorage 键…）——统一给一个稳定标识 */
function idOf(r) {
    const cand = r.id ?? r.key ?? r.step ?? r.flow ?? r.case ?? r.name ?? r.rule ?? r.data;
    return cand === undefined ? '—' : String(cand);
}

            title = String(r.item);

        const list = el('div', { cls: 'fields' });
        for (const f of r.fields) {

            s.append(el('code', { text: String(f.name) }));
            s.append(el('span', { cls: 'chip', text: String(f.type) }));
            if (f.required === true)
                s.append(el('span', { cls: 'chip req', text: '必填' }));
            if (f.userVisible === true)
                s.append(el('span', { cls: 'chip vis', text: '用户可见' }));
            if (f.derived === true)
                s.append(el('span', { cls: 'chip', text: '派生' }));
            d.append(s);
            d.append(kvTable(Object.entries(f), { skip: ['name', 'type'] }));

            const t = el('table', { cls: 'kv' });
            for (const tr0 of r.transitions) {
                const tr = el('tr');
                tr.append(el('th', { text: `${String(tr0.from)} → ${String(tr0.to)}` }));

            box.append(t);
        }
        box.append(evidenceChips(r.evidence));
        return box;
    }
    // 决策：逐字段成表，方便当需求输入读

            box.append(kvTable(Object.entries(a)));
        }
        box.append(evidenceChips(r.evidence));
        return box;
    }
    // 其余：通用键值表
    box.append(kvTable(Object.entries(r)));
    box.append(evidenceChips(r.evidence));
    return box;

function groupBy(label, rows, kind) {
    const wrap = el('section', { cls: 'group' });
    const d = el('details', { cls: 'grp' });
    d.open = true;
    const s = el('summary');
    s.append(el('strong', { text: label }));
    s.append(el('span', { cls: 'chip', text: `${rows.length} 条` }));
    d.append(s);
    const inner = el('div', { cls: 'grpBody' });
    for (const r of rows)
        inner.append(renderRecord(kind, r));
    d.append(inner);
    wrap.append(d);
    return wrap;
}

function buildNav() {
    const nav = el('nav', { cls: 'nav' });
    const main = document.getElementById('main');
    const buttons = new Map();
    const sections = new Map();
    /*
     * **一次性把十一个分节都建出来**，之后只切 display。
     * 为什么不做懒加载：全局搜索是「跨页面 / 动作 / 实体 / 字段 / 命令 / 路径 / 问题 / 裁断」的，
     * 懒加载会让没打开过的分节搜不到 —— 那就不是全局搜索了。
     */
    for (const s of SECTIONS) {
        const b = el('button', { cls: 'navBtn', text: s.name });
        b.addEventListener('click', () => show(s.id));
        nav.append(b);
        buttons.set(s.id, b);
        const wrap = el('div', { cls: 'section' });
        wrap.dataset.section = s.id;
        wrap.style.display = 'none';
        for (const n of s.build())
            wrap.append(n);
        sections.set(s.id, wrap);
        main.append(wrap);
    }
    function show(id, focus) {
        for (const [k, w] of sections)
            w.style.display = k === id ? '' : 'none';
        for (const [k, b] of buttons)
            b.classList.toggle('on', k === id);
        if (focus) {
            const rec = document.querySelector(`[data-id="${CSS.escape(focus)}"]`);
            if (rec) {
                ;
                rec.scrollIntoView({ block: 'center' });
                rec.classList.add('flash');
                setTimeout(() => rec.classList.remove('flash'), 1600);
            }
        }
        else {
            window.scrollTo({ top: 0 });
        }
    }
    window.addEventListener('hashchange', () => applyHash());
    /*
     * 哈希两种形态都认：
     *   #分节/记录号      （证据索引点出来的、以及页内互跳用的规范形态）
     *   #kind:记录号      （容错：按记录号反查它所在的分节）
     */
    function applyHash() {
        const h = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (!h)
            return show('overview');
        const slash = h.indexOf('/');
        if (slash > 0) {
            const id = h.slice(0, slash);
            const focus = h.slice(slash + 1);
            if (SECTIONS.some((s) => s.id === id))
                return show(id, focus);
        }
        if (SECTIONS.some((s) => s.id === h))
            return show(h);
        const rid = h.includes(':') ? h.slice(h.indexOf(':') + 1) : h;
        const node = rid ? document.querySelector(`[data-id="${CSS.escape(rid)}"]`) : null;
        if (node !== null) {
            const sec = node.closest('.section')?.getAttribute('data-section') ?? 'overview';
            return show(sec, rid);
        }
        show('overview');
    }
    ;
    window.__applyHash = applyHash;
    return { nav, show };
}
function wireFilters() {
    const q = document.getElementById('q');
    const lv = document.getElementById('lv');
    const vd = document.getElementById('vd');
    const count = document.getElementById('count');
    const clear = document.getElementById('clear');
    function apply() {
        const needle = q.value.trim().toLowerCase();
        const lvf = lv.value;
        const vdf = vd.value;
        let shown = 0;
        let total = 0;
        for (const rec of document.querySelectorAll('.rec')) {
            total++;
            const okQ = needle === '' || (rec.dataset.search ?? '').includes(needle);
            const okL = lvf === '' || rec.dataset.level === lvf;
            const okV = vdf === '' || rec.dataset.verdict === vdf;
            const ok = okQ && okL && okV;
            rec.style.display = ok ? '' : 'none';
            if (ok)
                shown++;
        }
        // 组内命中的折叠组自动打开；全空的组隐藏
        for (const grp of document.querySelectorAll('.grp')) {
            const body = grp.querySelector('.grpBody');
            const vis = [...body.querySelectorAll('.rec')].filter((r) => r.style.display !== 'none');
            grp.style.display = vis.length === 0 ? 'none' : '';
            if (needle !== '' || lvf !== '' || vdf !== '')
                grp.open = vis.length > 0;
        }
        for (const sec of document.querySelectorAll('.sub')) {
            const any = [...sec.querySelectorAll('.rec')].some((r) => r.style.display !== 'none');
            const hasRec = sec.querySelector('.rec') !== null;
            sec.style.display = !hasRec || any ? '' : 'none';
        }
        count.textContent = `${shown} / ${total} 条命中`;
    }
    q.addEventListener('input', apply);
    lv.addEventListener('change', apply);
    vd.addEventListener('change', apply);
    clear.addEventListener('click', () => {
        q.value = '';
        lv.value = '';
        vd.value = '';
        apply();
    });
    window.__applyFilters = apply;
}
function boot() {
    const meta = DATA.meta;
    document.title = meta.title;
    const head = document.getElementById('baseline');
    head.append(kvTable([
        ['仓库', meta.repo],
        ['分支', meta.branch],
        ['HEAD', `${meta.headShort} / ${meta.head}`],
        ['提交时间', meta.headDate],
        ['审计日期', meta.auditDate],
    ], { skip: [] }));
    const { nav } = buildNav();
    document.getElementById('navHost').append(nav);
    wireFilters();
    window.__applyHash();
    window.__applyFilters();
    const stats = {
        pages: DATA.pages.length,
        actions: DATA.actions.length,
        modules: DATA.modules.length,
        entities: DATA.entities.length,
        commands: DATA.contract.commands.length,
        problems: DATA.problems.length,
        decisions: DATA.decisions.length,
        unverified: DATA.unverified.length,
    };
    const s = document.getElementById('stats');
    for (const [k, v] of Object.entries(stats)) {
        const b = el('span', { cls: 'stat' });
        b.append(el('strong', { text: String(v) }));
        b.append(el('span', { text: k }));
        s.append(b);
    }
}
boot();
