<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文案审查台 · MKP SupportEase</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e5e7eb;
    --accent:#111827; --use:#1f7a4d; --use-bg:#e8f5ee; --drop:#8a8f98; --drop-bg:#f1f2f4;
    --edit:#a45a00; --edit-bg:#fdf1df; --focus:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111317; --card:#181b21; --ink:#e8eaee; --muted:#9aa1ac; --line:#282c34;
      --accent:#e8eaee; --use:#6ee7a8; --use-bg:#14301f; --drop:#8b929c; --drop-bg:#22262d;
      --edit:#f0b463; --edit-bg:#33260f; --focus:#7aa2ff; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    padding-bottom:72px;
  }
  code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  button{font:inherit;color:inherit}

  /* ---- 顶栏 ---- */
  .bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar-row{display:flex;align-items:center;gap:16px;padding:12px 22px}
  .brand{min-width:180px}
  .title{font-size:15px;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .progress{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
  .fill{height:100%;width:0;background:var(--use);transition:width .18s ease}
  .counts{display:flex;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
  .counts b{color:var(--ink);font-weight:600}
  .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);color:var(--bg);border-color:transparent}
  .btn.danger:hover{color:#c0392b;border-color:#c0392b}
  .bar-row.filters{padding-top:0;gap:10px;flex-wrap:wrap}
  .bar-row.legend{padding-top:0;padding-bottom:9px;gap:16px;font-size:11.5px;color:var(--muted)}
  .bar-row.legend b{color:var(--ink);font-weight:600}
  .bar-row.legend .spacer{flex:1}
  .pages{display:flex;gap:6px;flex-wrap:wrap}
  .page{border:1px solid transparent;background:transparent;border-radius:99px;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
  .page:hover{background:var(--card)}
  .page[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
  .page .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
  #q{flex:1;min-width:200px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:12.5px}
  #q:focus{outline:2px solid var(--focus);outline-offset:-1px}
  .status{display:flex;gap:4px}
  .st{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
  .st[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
  .st#btnTop{border:1px solid rgba(209,67,67,.35);color:#c0392b}
  .st#btnTop[aria-pressed="true"]{background:rgba(209,67,67,.12);border-color:rgba(209,67,67,.5);color:#c0392b}
  .sel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:12.5px}

  /* ---- 列表 ---- */
  main{max-width:1080px;margin:0 auto;padding:18px 22px 40px}
  .section-head{margin:26px 4px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin-bottom:10px}
  .card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:transparent}
  .card[data-d="use"]::before{background:var(--use)}
  .card[data-d="drop"]::before{background:var(--drop)}
  .card[data-d="edit"]::before{background:var(--edit)}
  .card[hidden]{display:none}
  .card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .key{cursor:pointer;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;word-break:break-all}
  .key:hover{border-color:var(--muted)}
  .loc{font-size:12px;color:var(--muted)}
  .loc b{color:var(--ink);font-weight:600}
  .file{font-size:11.5px;color:var(--muted);cursor:pointer;border-bottom:1px dotted var(--line)}
  .file:hover{color:var(--ink)}
  .type{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
  .tier{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px}
  .tier.p0{background:rgba(209,67,67,.16);color:#c0392b}
  .tier.p1{background:rgba(212,140,0,.16);color:#a45a00}
  .tier.p2{background:rgba(64,110,200,.14);color:#3558a8}
  .tier.p3{background:var(--drop-bg);color:var(--muted)}
  .tier.rank{background:var(--accent);color:var(--bg)}
  .score{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .why{font-size:11.5px;color:var(--muted);margin-top:5px}
  @media (prefers-color-scheme: dark){
    .tier.p0{color:#f08c82} .tier.p1{color:#f0b463} .tier.p2{color:#8fb0f0}
  }
  .spacer{flex:1}
  .badge{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:600}
  .badge.use{background:var(--use-bg);color:var(--use)}
  .badge.drop{background:var(--drop-bg);color:var(--drop)}
  .badge.edit{background:var(--edit-bg);color:var(--edit)}
  .badge.none{display:none}
  .cur{margin:10px 0 8px;padding-left:10px;border-left:2px solid var(--line);color:var(--ink);white-space:pre-wrap}
  .line{display:flex;gap:10px;margin:10px 0 8px;padding-left:10px;border-left:2px solid var(--line)}
  .line .lab{flex:0 0 40px;font-size:11px;color:var(--muted);padding-top:2px}
  .line .txt{color:var(--ink);white-space:pre-wrap}
  .line.old{opacity:.65}
  .line.old .txt{text-decoration:line-through;text-decoration-color:var(--line)}
  .line.new{border-left-color:var(--use)}
  .chip{font-size:11px;padding:1px 7px;border-radius:5px;white-space:nowrap}
  .chip.applied{background:var(--use-bg);color:var(--use)}
  .chip.skip{background:var(--drop-bg);color:var(--muted)}
  .sugg-wrap{margin:8px 0 2px}
  .sugg-wrap summary{font-size:11.5px;color:var(--muted);cursor:pointer;margin-bottom:6px;user-select:none}
  .sugg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:8px 0 2px}
  .sugg div{display:flex;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
  .sugg b{font-weight:600;color:var(--muted);flex:0 0 44px;font-size:11px;padding-top:1px}
  .sugg span{color:var(--ink);word-break:break-word}
  .note{margin-top:7px;font-size:12px;color:var(--muted)}
  .decide{display:flex;gap:6px;margin-top:10px}
  .decide button{border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 14px;cursor:pointer;font-size:12.5px}
  .decide button:hover{border-color:var(--muted)}
  .card[data-d="use"] .decide button[data-act="use"]{background:var(--use-bg);color:var(--use);border-color:transparent;font-weight:600}
  .card[data-d="drop"] .decide button[data-act="drop"]{background:var(--drop-bg);color:var(--drop);border-color:transparent;font-weight:600}
  .card[data-d="edit"] .decide button[data-act="edit"]{background:var(--edit-bg);color:var(--edit);border-color:transparent;font-weight:600}
  .editor{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .card.editing .editor{display:block}
  .editor textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;font:inherit;font-size:13px}
  .editor textarea:focus{outline:2px solid var(--focus);outline-offset:-1px}
  .editor-foot{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--muted)}
  .editor-foot .spacer{flex:1}
  .note-row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .linkbtn{border:0;background:none;padding:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
  .linkbtn:hover{color:var(--ink)}
  .noteInput{display:none;flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:5px 9px;font:inherit;font-size:12.5px}
  .noteInput:focus{outline:2px solid var(--focus);outline-offset:-1px}
  .card.noting .noteInput{display:block}
  .card.noting .linkbtn{color:var(--ink);font-weight:600}
  .empty{padding:70px 0;text-align:center;color:var(--muted)}
  .foot{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 22px;font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center}
  .foot .warn{color:var(--edit)}
  .toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(12px);background:var(--accent);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:760px){
    .sugg{grid-template-columns:1fr}
    .brand{min-width:0}
    .counts{display:none}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-row">
    <div class="brand">
      <div class="title">文案审查台</div>
      <div class="sub" id="stat">—</div>
    </div>
    <div class="progress" aria-hidden="true"><div class="fill" id="progFill"></div></div>
    <div class="counts" id="counts"></div>
    <div class="actions">
      <button class="btn" id="btnImport" title="导入之前导出的 .md 或 .json">导入批注</button>
      <input type="file" id="fileInput" accept=".md,.json,.txt" hidden>
      <button class="btn danger" id="btnClear" title="清空本机的批注记录">清空</button>
      <button class="btn primary" id="btnExportMd">导出批注</button>
      <button class="btn" id="btnExportJson">导出 JSON</button>
    </div>
  </div>
  <div class="bar-row filters">
    <div class="pages" id="pages"></div>
    <input id="q" type="search" placeholder="搜索 键名 / 现文案 / 建议 / 备注…" autocomplete="off">
    <select id="sort" class="sel" title="排序方式">
      <option value="score">按优先级</option>
      <option value="page">按页面顺序</option>
    </select>
    <div class="status" id="statusFilters">
      <button class="st" data-s="all" aria-pressed="true">全部</button>
      <button class="st" data-s="none" aria-pressed="false">未批</button>
      <button class="st" data-s="use" aria-pressed="false">同意</button>
      <button class="st" data-s="drop" aria-pressed="false">不改</button>
      <button class="st" data-s="edit" aria-pressed="false">自己写</button>
      <button class="st" id="btnTop" aria-pressed="false" title="只看我挑的 30 条（按先后排好）">只看建议 30</button>
      <button class="st" id="btnUnreviewed" aria-pressed="false" title="已按默认同意改掉、但还没看过的">未复核</button>
    </div>
  </div>
  <div class="bar-row legend" id="legend">
    <span><b>同意</b> = 按建议改</span>
    <span><b>不改</b> = 保留现在的文案</span>
    <span><b>自己写</b> = 用你写的这句（繁 / 日 / 英 我补）</span>
    <span class="spacer"></span>
    <span id="applyInfo"></span>
    <span>点第二次取消</span>
  </div>
</header>

<main id="list"></main>
<div class="empty" id="empty" hidden>没有符合条件的条目</div>

<div class="foot">
  <span>点按「同意 / 不改 / 自己写」即存本机；自己写只填中文，繁 / 日 / 英 我按意思重写。</span>
  <span class="spacer" style="flex:1"></span>
  <span class="warn" id="storageWarn" hidden>浏览器不让存本地数据，请批完立刻导出，别关页面</span>
</div>
<div class="toast" id="toast"></div>

<script>

const LS_KEY = 'mkp-copy-audit-1';
const PAGES = ['预设页','设置页','首页','工艺页','校准页','报告页','外壳与通知'];

/* ---------- 存储 ---------- */
let storageOK = true;
let decisions = {};
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw === null) decisions = JSON.parse(JSON.stringify(SEED || {}));
  else decisions = JSON.parse(raw) || {};
} catch (e) { storageOK = false; }

/* 旧版按钮叫「用 / 弃 / 改」，有人把「同意」直接写进了「改」的框里 —— 认回同意 */
const YES_WORDS = ['同意', '同意备注', '同意建议', '赞成', '采纳', '可以', '行', '好', 'ok', 'okay', '✓', '对'];
const NO_WORDS = ['不用', '不改', '保留', '保留原文', '否', 'no'];
let migrated = 0;
for (const [id, d] of Object.entries(decisions)) {
  if (!d || d.d !== 'edit') continue;
  const t = String(d.s || '').trim().toLowerCase();
  if (YES_WORDS.includes(t)) { decisions[id] = { d: 'use', s: '', t: d.t || Date.now() }; migrated++; }
  else if (NO_WORDS.includes(t)) { decisions[id] = { d: 'drop', s: '', t: d.t || Date.now() }; migrated++; }
}
if (migrated) setTimeout(() => toast(`已把 ${migrated} 条写成「同意」的认成同意`), 700);
if (!storageOK) document.getElementById('storageWarn').hidden = false;

let saveTimer = null;
function clearDecision(id){
  const d = decisions[id];
  if (d && (d.n || '').trim()) decisions[id] = { d: 'note', s: '', n: d.n, t: Date.now() };
  else delete decisions[id];
}
function save(){
  if (!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(decisions)); } catch (e) { storageOK = false; }
  }, 120);
}

/* ---------- 工具 ---------- */
const $ = (s, el=document) => el.querySelector(s);
const fmt = n => n.toLocaleString('zh-CN');
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1400);
}
function copy(text, okMsg){
  const done = () => toast(okMsg);
  if (navigator.clipboard && window.isSecureContext !== false) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) { toast('复制失败，手动选中吧'); }
    ta.remove();
  }
}
const state = { page: 'all', status: 'all', q: '', top: false, unreviewed: false, sort: 'score' };
function sortCards(){
  const order = new Map(ITEMS.map((it, i) => [it.id, i]));
  const arr = ITEMS.slice();
  if (state.sort === 'score') {
    arr.sort((a, b) =>
      (a.rank || 999) - (b.rank || 999) ||
      b.score - a.score ||
      order.get(a.id) - order.get(b.id));
  } else {
    arr.sort((a, b) => order.get(a.id) - order.get(b.id));
  }
  for (const it of arr) list.appendChild(nodes.get(it.id));
}

/* ---------- 渲染 ---------- */
const list = $('#list');
const nodes = new Map();

function cardHTML(it){
  const types = it.type.map(t => `<span class="type">${esc(t)}</span>`).join('');
  const line = it.line ? `zh-CN.ts:${it.line}` : '拼接句（多个键）';
  return `
  <article class="card" data-id="${esc(it.id)}" data-d="">
    <div class="card-head">
      ${it.rank ? `<span class="tier rank" title="建议第 ${it.rank} 条改">建议 ${it.rank}</span>` : `<span class="tier ${it.tier.toLowerCase()}" title="优先级 ${it.score} / 100">${it.tier}</span>`}
      <code class="key" data-copy="${esc(it.key)}" title="点一下复制键名">${esc(it.key)}</code>
      <span class="loc">${esc(it.page)} › <b>${esc(it.section)}</b></span>
      <span class="file" data-copy="src/i18n/${line}" title="点一下复制位置；行号按生成时的字典算，改完字典会漂，以键名为准">${esc(line)}</span>
      ${types}
      <span class="score">${it.score}</span>
      <span class="spacer"></span>
      ${it.applied ? '<span class="chip applied">已应用</span>' : (it.skip ? `<span class="chip skip">${esc(it.skip)}</span>` : '')}
      <span class="badge none"></span>
    </div>
    ${it.applied
      ? `<div class="line new"><span class="lab">现文案</span><div class="txt">${rich(it.appliedZh)}</div></div>
         <div class="line old"><span class="lab">旧文案</span><div class="txt">${rich(it.cur)}</div></div>`
      : `<div class="line"><span class="lab">现文案</span><div class="txt">${rich(it.cur)}</div></div>`}
    <details class="sugg-wrap"${it.applied ? '' : ' open'}>
      <summary>${it.applied ? '当时的建议（四语）' : '建议（四语）'}</summary>
      <div class="sugg">
        <div><b>zh-CN</b><span>${rich(it.zh)}</span></div>
        <div><b>zh-TW</b><span>${rich(it.tw)}</span></div>
        <div><b>ja</b><span>${rich(it.ja)}</span></div>
        <div><b>en</b><span>${rich(it.en)}</span></div>
      </div>
    </details>
    ${it.note && it.note !== '—' ? `<div class="note">备注：${rich(it.note)}</div>` : ''}
    ${it.why ? `<div class="why">排序依据：${esc(it.why)}</div>` : ''}
    <div class="decide">
      <button data-act="use" title="同意这条建议，按建议改">同意</button>
      <button data-act="drop" title="不接受这条建议，保留现在的文案">不改</button>
      <button data-act="edit" title="我自己写一句，替掉建议">自己写</button>
    </div>
    <div class="editor">
      <textarea placeholder="写你想用的那句中文（繁 / 日 / 英 我按意思补）"></textarea>
      <div class="editor-foot">
        <span>存进的是这句中文；清空后等于取消「自己写」。</span>
        <span class="spacer"></span>
        <button class="btn" data-act="cancelEdit">收起</button>
      </div>
    </div>
    <div class="note-row">
      <button class="linkbtn" data-act="note">＋ 备注（只给我看）</button>
      <input class="noteInput" type="text" placeholder="这句不落界面，写给我看：为什么、要保留什么…">
    </div>
  </article>`;
}

function build(){
  const frag = document.createDocumentFragment();
  for (const it of ITEMS){
    const wrap = document.createElement('div');
    wrap.innerHTML = cardHTML(it).trim();
    const card = wrap.firstElementChild;
    frag.appendChild(card);
    nodes.set(it.id, card);
  }
  list.appendChild(frag);
}

function paint(card, id){
  const d = decisions[id];
  const badge = $('.badge', card);
  const isNote = !!(d && d.d === 'note');
  card.dataset.d = d && !isNote ? d.d : '';
  if (isNote) { badge.className = 'badge drop'; badge.textContent = '备注'; }
  else {
    badge.className = 'badge ' + (d ? d.d : 'none');
    badge.textContent = d ? ({use:'同意', drop:'不改', edit:'自己写'}[d.d]) : '';
  }
  const ta = $('textarea', card);
  if (d && d.d === 'edit' && document.activeElement !== ta) ta.value = d.s || '';
  if (!d || d.d !== 'edit') card.classList.remove('editing');
  if (d && d.d === 'edit') card.classList.add('editing');
  const noteInp = $('.noteInput', card);
  const btn = $('.linkbtn', card);
  const hasNote = !!(d && d.n && d.n.trim());
  card.classList.toggle('noting', hasNote);
  if (document.activeElement !== noteInp) noteInp.value = (d && d.n) || '';
  btn.textContent = hasNote ? '备注' : '＋ 备注（只给我看）';
}

function stats(){
  let use=0, drop=0, edit=0;
  for (const k in decisions){ const d = decisions[k].d; if (d==='use') use++; else if (d==='drop') drop++; else if (d==='edit') edit++; }
  const done = use + drop + edit;
  const applied = ITEMS.filter(i => i.applied).length;
  const left = ITEMS.filter(i => i.applied && !decisions[i.id]).length;
  $('#counts').innerHTML = `<span>已应用 <b>${fmt(applied)}</b></span><span>已批 <b>${fmt(done)}</b></span><span>同意 <b>${fmt(use)}</b></span><span>不改 <b>${fmt(drop)}</b></span><span>自己写 <b>${fmt(edit)}</b></span><span title="已改、还没看过的">未复核 <b>${fmt(left)}</b></span>`;
  $('#stat').textContent = `共 ${fmt(ITEMS.length)} 条 · 未批 ${fmt(ITEMS.length - done)}`;
  const info = document.getElementById('applyInfo');
  if (info) info.textContent = `${fmt(applied)} 条已应用 · ${fmt(ITEMS.length - applied)} 条未应用`;
  $('#progFill').style.width = (done / ITEMS.length * 100).toFixed(2) + '%';
  buildPages();
}

function pageCounts(){
  const m = {};
  for (const it of ITEMS){ m[it.page] = m[it.page] || {total:0, done:0}; m[it.page].total++; if (decisions[it.id]) m[it.page].done++; }
  return m;
}

function buildPages(){
  const m = pageCounts();
  $('#pages').innerHTML = ['all', ...PAGES].map(p => {
    const on = state.page === p ? 'true' : 'false';
    if (p === 'all') return `<button class="page" data-page="all" aria-pressed="${on}">全部<span class="n">${fmt(ITEMS.length)}</span></button>`;
    const c = m[p] || {total:0, done:0};
    return `<button class="page" data-page="${p}" aria-pressed="${on}">${p}<span class="n">${fmt(c.done)}/${fmt(c.total)}</span></button>`;
  }).join('');
}

function apply(){
  const q = state.q.trim().toLowerCase();
  let shown = 0;
  for (const it of ITEMS){
    const card = nodes.get(it.id);
    const d = decisions[it.id] ? decisions[it.id].d : 'none';
    let ok = true;
    if (state.page !== 'all' && it.page !== state.page) ok = false;
    if (ok && state.status !== 'all'){
      if (state.status === 'none') ok = !decisions[it.id] || decisions[it.id].d === 'note';
      else ok = d === state.status;
    }
    if (ok && q){
      const hay = (it.key + ' ' + it.cur + ' ' + it.zh + ' ' + it.tw + ' ' + it.ja + ' ' + it.en + ' ' + it.note + ' ' + it.section).toLowerCase();
      ok = hay.includes(q);
    }
    if (ok && state.top) ok = !!it.rank;
    if (ok && state.unreviewed) ok = it.applied && !decisions[it.id];
    card.hidden = !ok;
    if (ok) shown++;
  }
  $('#empty').hidden = shown > 0;
}

function refresh(){ buildPages(); stats(); apply(); }

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const pageBtn = e.target.closest('.page');
  if (pageBtn){
    state.page = pageBtn.dataset.page;
    for (const b of document.querySelectorAll('.page')) b.setAttribute('aria-pressed', String(b === pageBtn));
    apply(); return;
  }
  const topBtn = e.target.closest('#btnTop');
  if (topBtn){
    state.top = !state.top;
    topBtn.setAttribute('aria-pressed', String(state.top));
    apply(); return;
  }
  const unBtn = e.target.closest('#btnUnreviewed');
  if (unBtn){
    state.unreviewed = !state.unreviewed;
    unBtn.setAttribute('aria-pressed', String(state.unreviewed));
    apply(); return;
  }
  const st = e.target.closest('.st');
  if (st){
    state.status = st.dataset.s;
    for (const b of document.querySelectorAll('.st')) b.setAttribute('aria-pressed', String(b === st));
    apply(); return;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp){ copy(cp.dataset.copy, '已复制：' + cp.dataset.copy); return; }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const card = act.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const a = act.dataset.act;
  const ta = $('textarea', card);
  const d = decisions[id];

  if (a === 'note'){
    const on = !card.classList.contains('noting');
    card.classList.toggle('noting', on);
    $('.linkbtn', card).textContent = on ? '备注' : '＋ 备注（只给我看）';
    if (on) $('.noteInput', card).focus();
    return;
  }
  if (a === 'use' || a === 'drop'){
    if (d && d.d === a) clearDecision(id);
    else decisions[id] = { d: a, s: (d && d.s) || '', n: (d && d.n) || '', t: Date.now() };
    paint(card, id); save(); stats();
  }
  if (a === 'edit'){
    card.classList.add('editing');
    if (!d || d.d !== 'edit'){ decisions[id] = { d: 'edit', s: ta.value || '', n: (d && d.n) || '', t: Date.now() }; save(); }
    paint(card, id); $('textarea', card).focus(); stats();
  }
  if (a === 'cancelEdit'){
    if (d && d.d === 'edit' && !(d.s || '').trim()){
      if ((d.n || '').trim()) decisions[id] = { d: 'note', s: '', n: d.n, t: Date.now() };
      else delete decisions[id];
    }
    card.classList.remove('editing');
    paint(card, id); save(); stats();
  }
});

document.addEventListener('input', e => {

    decisions[id] = d;
    card.classList.toggle('noting', !!text.trim());

  if (e.target.tagName !== 'TEXTAREA') return;
  const card = e.target.closest('.card');
  if (!card) return;

  if (text.trim()) decisions[id] = { d: 'edit', s: text, t: Date.now() };
  else if (decisions[id] && decisions[id].d === 'edit') decisions[id] = { d: 'edit', s: '', t: Date.now() };
  save(); stats();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const card = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card');
    if (card){ card.classList.remove('editing'); }
  }
});

let qTimer = null;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value; apply(); }, 120);
});

$('#btnClear').addEventListener('click', () => {
  const n = Object.keys(decisions).length;
  if (!n) return toast('还没有批注');
  if (!confirm(`清空全部 ${n} 条批注？文案已经改过，清空只影响这份复盘记录。`)) return;
  decisions = {};
  try { localStorage.setItem(LS_KEY, '{}'); } catch(e){}
  for (const [id, card] of nodes) paint(card, id);
  refresh(); toast('已清空');
});

/* ---------- 导入之前导出的批注 ---------- */
function parseMd(text){
  const out = {};
  const map = {'同意':'use','用':'use','不改':'drop','弃':'drop','自己写':'edit','改':'edit','备注':'note'};
  let cur = null;
  for (const line of text.split(/\r?\n/)){
    const m = line.match(/^- \[(同意|用|不改|弃|自己写|改|备注)\]\s+`([^`]+)`/);
    if (m){
      cur = m[2].trim();
      out[cur] = { d: map[m[1]], s: '', t: Date.now() };
      continue;
    }
    const mine = line.match(/^\s+- 我的：(.*)$/);
    if (mine && cur) out[cur].s = mine[1].trim();
    const note = line.match(/^\s+- 备注：(.*)$/);
    if (note && cur) out[cur].n = note[1].trim();
  }
  return out;
}

function parseImport(text){
  const t = text.trim();
  if (t.startsWith('{')){
    const data = JSON.parse(t);
    if (Array.isArray(data.decisions)){
      const out = {};
      for (const d of data.decisions){
        const key = (d.key || '').trim();
        if (!key) continue;
        out[key] = { d: d.decision, s: d.text || '', n: d.note || '', t: Date.now() };
      }
      return out;
    }
    return data;
  }
  return parseMd(text);
}

$('#btnImport').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const parsed = parseImport(await file.text());
    const keyToId = new Map();
    for (const it of ITEMS) for (const k of it.key.split(' / ')) keyToId.set(k, it.id);
    let n = 0;
    for (const [key, v] of Object.entries(parsed)){
      const id = nodes.has(key) ? key : keyToId.get(key);
      if (!id || !v || !v.d) continue;
      decisions[id] = { d: v.d, s: v.s || '', n: v.n || '', t: v.t || Date.now() };
      n++;
    }
    save();
    for (const [id, card] of nodes) paint(card, id);
    refresh();
    toast(`导入 ${n} 条批注`);
  } catch (err){
    toast('导入失败：文件读不懂');
  } finally {
    e.target.value = '';
  }
});

$('#btnExportMd').addEventListener('click', () => {
  const now = new Date();
  const stamp = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const counts = { use: 0, drop: 0, edit: 0, note: 0 };
  for (const it of ITEMS){ const d = decisions[it.id]; if (d) counts[d.d] = (counts[d.d] || 0) + 1; }
  const done = counts.use + counts.drop + counts.edit + counts.note;
  const L = [];
  L.push('# 文案批注（导出）');
  L.push('');
  L.push(`> 导出于 ${stamp} ${time} · 共 ${ITEMS.length} 条 · 已批 ${counts.use + counts.drop + counts.edit}（同意 ${counts.use} · 不改 ${counts.drop} · 自己写 ${counts.edit}）· 仅备注 ${counts.note}`);
  L.push('>');
  L.push('> 标记：**同意** = 按建议改 · **不改** = 保留原文 · **自己写** = 用「我的」那一句 · **备注** = 只给我看的话。');
  L.push('');
  if (!done) L.push('（还没有任何批注）');
  const pagesInOrder = PAGES.filter(p => ITEMS.some(i => i.page === p));
  for (const page of pagesInOrder){
    const rows = ITEMS.filter(i => i.page === page && decisions[i.id]);
    if (!rows.length) continue;
    L.push(`## ${page}`);
    L.push('');
    for (const it of rows){
      const d = decisions[it.id];
      const err = it.line ? `zh-CN.ts:${it.line}` : '拼接句';
      const where = `${it.page} › ${it.section} · ${err}`;
      if (d.d === 'use'){
        L.push(`- [同意] \`${it.key}\`（${where}）`);
        L.push(`  - 采用：${it.zh}`);
      } else if (d.d === 'drop'){
        L.push(`- [不改] \`${it.key}\`（${where}）`);
        L.push(`  - 保留现文案：${it.cur}`);
      } else if (d.d === 'edit'){
        L.push(`- [自己写] \`${it.key}\`（${where}）`);
        L.push(`  - 现：${it.cur}`);
        L.push(`  - 我的：${(d.s || '').replace(/\n/g, ' ') || '（未填）'}`);
      } else {
        L.push(`- [备注] \`${it.key}\`（${where}）`);
        L.push(`  - 现：${it.cur}`);
      }
      if (d.n && d.n.trim()) L.push(`  - 备注：${d.n.replace(/\n/g, ' ')}`);
    }
    L.push('');
  }
  const blob = new Blob([L.join('\n')], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `copy-audit-decisions-${stamp}.md`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已导出批注');
});

$('#btnExportJson').addEventListener('click', () => {
  const out = {
    exportedAt: new Date().toISOString(),
    total: ITEMS.length,
    decisions: Object.entries(decisions).map(([id, d]) => {
      const it = ITEMS.find(i => i.id === id) || {};
      return { id, page: it.page, section: it.section, key: it.key, line: it.line || null, decision: d.d, text: d.s || '', note: d.n || '' };
    })
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'copy-audit-decisions.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已导出 JSON');
});

$('#sort').addEventListener('change', e => {
  state.sort = e.target.value;
  sortCards();
});

/* ---------- 启动 ---------- */
if (migrated) save();
build();
sortCards();
buildPages();
for (const [id, card] of nodes) paint(card, id);
stats();
apply();
</script>
