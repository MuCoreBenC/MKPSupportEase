<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>SupportEase 安装程序</title>
<style>
  :root {
    --accent: #20b25a;
    --accent-hover: #1a9d4f;
    --ink: #1f2328;
    --muted: #8b939c;
    --line: #e6e8eb;
    --danger: #c8453c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #fff;
    font: 13px/1.55 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .win { width: 100vw; height: 100vh; display: flex; flex-direction: column; }

  .titlebar {
    height: 38px; flex: none; display: flex; align-items: center;
    padding: 0 6px 0 14px; font-size: 11.5px; color: #97a0a8;
  }
  .titlebar .name { display: flex; align-items: center; pointer-events: none; }
  .titlebar .spacer { flex: 1; }
  .titlebar .btns { display: flex; }
  .titlebar button {
    width: 30px; height: 26px; border: 0; background: none; cursor: pointer;
    color: #7c848c; border-radius: 5px; font-size: 12px; font-family: inherit;
  }
  .titlebar button:hover { background: #f1f3f5; }
  .titlebar button.close:hover { background: #e81123; color: #fff; }

  .tbicon { width: 18px; height: 18px; display: block; margin-right: 7px; flex: none; }

  .stage { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 20px; }
  .stage.on { display: flex; }

  h1 { font-size: 27px; margin: 0; letter-spacing: .3px; }
  .ver { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  .primary {
    margin-top: 22px; width: 216px; height: 42px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 600;
    letter-spacing: .4px; cursor: pointer;
    box-shadow: 0 7px 16px rgba(32, 178, 90, .24);
  }
  .primary:hover { background: var(--accent-hover); }
  .primary:disabled { opacity: .55; cursor: default; }

  .opts { margin-top: 20px; display: flex; gap: 26px; }
  .opts label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: #4d565f; cursor: pointer;
  }
  input[type="checkbox"] {
    appearance: none; width: 15px; height: 15px; margin: 0; flex: none; cursor: pointer;
    border: 1.5px solid #cfd6db; border-radius: 4px; background: #fff; position: relative;
  }
  input[type="checkbox"]:hover { border-color: #b4bec6; }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 4px; top: 1px;
    width: 3.5px; height: 7px; border: solid #fff; border-width: 0 1.8px 1.8px 0;
    transform: rotate(45deg);
  }

  .path { margin-top: 14px; display: flex; gap: 7px; width: 452px; }
  .path input {
    flex: 1; font: inherit; font-size: 11.5px; color: #5a636c;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: #fafbfc; user-select: text;
  }
  .path input:focus { outline: none; border-color: #c3ccd4; background: #fff; }
  .path button {
    flex: none; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px;
    background: #f4f6f8; color: #5a636c; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .path button:hover { background: #eceff2; }
  .path button:disabled { opacity: .45; cursor: default; }

  .note { margin: 12px 0 0; font-size: 11px; color: #a2a9b1; }
  .note a { color: var(--accent); text-decoration: none; }
  .note a:hover { text-decoration: underline; }

  /* 安装中 */
  .installing h2 { font-size: 20px; margin: 14px 0 3px; font-weight: 600; }
  .installing .sub { color: var(--muted); font-size: 11.5px; margin: 0 0 24px; }
  .bar { width: 452px; height: 6px; border-radius: 99px; background: #eef1f3; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
  .progressline {
    width: 452px; margin-top: 9px; display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
  }
  .error { color: var(--danger); font-size: 11.5px; margin-top: 12px; max-width: 452px; text-align: center; }

  /* 完成 */
  .tick {
    width: 68px; height: 68px; border-radius: 50%; background: rgba(32, 178, 90, .12);
    display: grid; place-items: center;
  }
  .tick svg { width: 32px; height: 32px; }
  .done h2 { font-size: 21px; margin: 18px 0 4px; }
  .done .sub { color: var(--muted); font-size: 11.5px; margin: 0 0 24px; }
  .done .row { display: flex; gap: 10px; align-items: center; }
  .ghost {
    width: 110px; height: 42px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: #4d565f; font: inherit; font-size: 13px; cursor: pointer;
  }
  .ghost:hover { background: #f7f8f9; }
  .done .ghost { width: 96px; height: 40px; font-size: 12.5px; }
  .lead { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
  .done .primary { margin-top: 0; width: 150px; height: 40px; font-size: 13.5px; }

  /* 卸载 */
  :root { --danger: #c8453c; --danger-hover: #b13a32; }
  .danger {
    width: 120px; height: 42px; border: 0; border-radius: 999px;
    background: var(--danger); color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    letter-spacing: .4px; cursor: pointer; box-shadow: 0 7px 16px rgba(200, 69, 60, .22);
  }
  .danger:hover { background: var(--danger-hover); }
  .keep {
    margin-top: 20px; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #4d565f; cursor: pointer;
  }
  .row2 { display: flex; gap: 10px; margin-top: 26px; align-items: center; }
  .tick.grey { background: #f0f2f4; }
  .tick.grey svg { stroke: #6b7785; }
  .un-done .sub { max-width: 420px; text-align: center; }

  /* 深色（跟随系统） */
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8ecef; --muted: #838d96; --line: #33393f; }
    body { background: #1d2125; }
    .titlebar { color: #616b73; }
    .titlebar button { color: #8a949c; }
    .titlebar button:hover { background: #272c31; }
    .titlebar button.close:hover { background: #e81123; color: #fff; }
    .ver, .note { color: #78828a; }
    .opts label { color: #b6bfc7; }
    .path input { background: #24292e; border-color: #33393f; color: #b6bfc7; }
    .path input:focus { background: #262b30; border-color: #4a525a; }
    .path button { background: #272c31; border-color: #33393f; color: #b6bfc7; }
    .path button:hover { background: #2f353a; }
    input[type="checkbox"] { background: #24292e; border-color: #4a525a; }
    .bar { background: #2c3238; }
    .ghost { background: #24292e; border-color: #33393f; color: #b6bfc7; }
    .tick { background: rgba(32, 178, 90, .16); }
    .note a { color: #5ddc92; }
  }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar" data-tauri-drag-region>
    <span class="name" data-tauri-drag-region>
      <img class="tbicon" src="{{ICON_BLACK}}" alt="" />
      SupportEase 安装程序
    </span>
    <div class="spacer" data-tauri-drag-region></div>
    <span class="btns">
      <button id="min" title="最小化">─</button>
      <button id="quit" class="close" title="关闭">✕</button>
    </span>
  </div>

  <!-- 待安装 -->
  <section class="stage" data-stage="ready">
    <h1>SupportEase</h1>
    <div class="ver" id="ver">版本 —</div>
    <button class="primary" id="go">快速安装</button>

    <div class="opts">
      <label><input type="checkbox" id="desktop" checked /> 创建桌面快捷方式</label>
      <label><input type="checkbox" id="startmenu" checked /> 创建开始菜单快捷方式</label>
    </div>

    <div class="path">
      <input type="text" id="dir" value="" spellcheck="false" />
      <button id="browse">浏览...</button>
    </div>

    <p class="note">不需要管理员权限 · 以 AGPL-3.0 许可发布</p>
  </section>

  <!-- 卸载：确认 -->
  <section class="stage" data-stage="un-confirm">
    <h1>卸载 SupportEase</h1>
    <p class="lead">会从本机移除 SupportEase 程序本身。</p>
    <label class="keep"><input type="checkbox" id="wipe" /> 同时删除预设、校准记录和日志</label>
    <div class="row2">
      <button class="ghost" id="un-cancel">取消</button>
      <button class="danger" id="un-go">卸载</button>
    </div>
  </section>

  <!-- 安装中 / 卸载中 -->
  <section class="stage installing" data-stage="progress">
    <h2 id="progTitle">正在安装</h2>
    <p class="sub">马上就好，请不要关闭窗口。</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="progressline"><span id="what">正在准备…</span><span id="pct">0%</span></div>
    <p class="error" id="error"></p>
  </section>

  <!-- 完成 -->
  <section class="stage done" data-stage="done">
    <div class="tick">
      <svg viewBox="0 0 24 24" fill="none" stroke="#17924a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg>
    </div>
    <h2>SupportEase 已经安装完成</h2>
    <p class="sub">桌面和开始菜单里都能找到它。</p>
    <div class="row">
      <button class="ghost" id="close">关闭</button>
      <button class="primary" id="launch">立即体验</button>
    </div>
  </section>

  <!-- 卸载：完成 -->
  <section class="stage done un-done" data-stage="un-done">
    <div class="tick grey">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6b7785" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg>
    </div>
    <h2>SupportEase 已卸载</h2>
    <p class="sub" id="un-sub">预设和校准记录还在本地，重新安装后可以直接用。</p>
    <button class="ghost" id="un-close">关闭</button>
  </section>
</div>

<script>
  // 与 Rust 之间的唯一通道：postMessage(JSON) → WebView2 的 message 事件
  const post = (msg) => window.chrome.webview.postMessage(msg)
  const $ = (id) => document.getElementById(id)
  const stage = (name) => {
    document.querySelectorAll('.stage').forEach((s) => s.classList.toggle('on', s.dataset.stage === name))
  }

  const ICON_BLACK = '{{ICON_BLACK}}'
  const ICON_WHITE = '{{ICON_WHITE}}'

  $('min').onclick = () => post({ cmd: 'minimize' })
  $('quit').onclick = () => post({ cmd: 'close' })
  $('close').onclick = () => post({ cmd: 'close' })

  // 无边框窗口拖动：交给系统的「非客户区」逻辑，鼠标移动由 Windows 接管
  document.querySelector('.titlebar').addEventListener('mousedown', (e) => {
    if (e.target.closest('button')) return
    post({ cmd: 'drag' })
  })

  // 点一次就锁住，避免用户在对话框出来前连点堆一串请求
  $('browse').onclick = () => {
    if ($('browse').disabled) return
    $('browse').disabled = true
    setTimeout(() => post({ cmd: 'browse', current: $('dir').value }), 60)
  }

  $('launch').onclick = () => {
    post({ cmd: 'launch', dir: $('dir').value })
    post({ cmd: 'close' })
  }

  let finished = false
  let mode = 'install'

  window.chrome.webview.addEventListener('message', (e) => {
    const m = e.data || {}
    if (m.event === 'init') {
      mode = m.mode === 'uninstall' ? 'uninstall' : 'install'
      if (mode === 'uninstall') {
        const name = document.querySelector('.titlebar .name')
        name.lastChild.textContent = ' SupportEase 卸载程序'
        stage('un-confirm')
      } else {
        $('dir').value = m.dir || ''
        $('ver').textContent = '版本 ' + (m.version || '')
        stage('ready')
      }
    } else if (m.event === 'dir') {
      if (m.path) $('dir').value = m.path
      $('browse').disabled = false
    } else if (m.event === 'dir-cancel') {
      $('browse').disabled = false
    } else if (m.event === 'progress') {
      $('fill').style.width = m.pct + '%'
      $('pct').textContent = m.pct + '%'
      $('what').textContent = m.what || ''
    } else if (m.event === 'done') {
      if (!finished) {
        finished = true
        setTimeout(() => stage(mode === 'uninstall' ? 'un-done' : 'done'), 400)
      }
    } else if (m.event === 'error') {
      finished = true
      $('error').textContent = m.message || '操作失败'
      setTimeout(() => {
        stage(mode === 'uninstall' ? 'un-confirm' : 'ready')
        $('go').disabled = false
      }, 2200)
    }
  })

  $('go').onclick = () => {
    const dir = $('dir').value.trim()
    if (!dir) return
    $('go').disabled = true
    $('error').textContent = ''
    $('progTitle').textContent = '正在安装'
    $('fill').style.width = '0%'
    $('pct').textContent = '0%'
    $('what').textContent = '正在准备…'
    stage('progress')
    post({
      cmd: 'install',
      dir,
      desktop: $('desktop').checked,
      startMenu: $('startmenu').checked,
    })
  }

  $('un-cancel').onclick = () => post({ cmd: 'close' })
  $('un-close').onclick = () => post({ cmd: 'close' })
  $('un-go').onclick = () => {
    $('error').textContent = ''
    $('progTitle').textContent = '正在卸载'
    $('fill').style.width = '0%'
    $('pct').textContent = '0%'
    $('what').textContent = '正在准备…'
    stage('progress')
    post({ cmd: 'uninstall', wipe: $('wipe').checked })
  }
  $('wipe').onchange = (e) => {
    $('un-sub').textContent = e.target.checked
      ? '预设、校准记录和日志已经一起删除。'
      : '预设和校准记录还在本地，重新安装后可以直接用。'
  }

  const mq = window.matchMedia('(prefers-color-scheme: dark)')
  const paintIcon = () => {
    document.querySelectorAll('img.tbicon').forEach((img) => {
      img.src = mq.matches ? ICON_WHITE : ICON_BLACK
    })
  }
  mq.addEventListener('change', paintIcon)
  paintIcon()

  post({ cmd: 'init' })
</script>
</body>
</html>
