[package]
name = "mkp-installer"
version = "0.1.0"
description = "SupportEase 安装程序（Windows）"
authors = ["MuCoreBenC"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"
publish = false

# ★ 空 workspace 表：这个 crate 在仓库目录里，但**不进根 workspace**。
#   根 workspace 的 members 是显式列表（见根 Cargo.toml），不带这一份 ——
#   它只该在 Windows 上编（CI 的 macOS job 跑 `cargo clippy --all-targets`，
#   把 Windows 专用的安装器拖进去会让那边红）。这行让 `cargo` 不去父目录找 workspace。
[workspace]

[build-dependencies]
# 把 icon.ico 嵌进 exe（资源管理器与任务栏看到的那颗）
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 与客户端同一个 zip 档（那里用来读 3MF）；安装器只用解压这一半
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
# payload 的外层压缩。xz 的压缩率比 deflate 高约 30%（9.6 MB → 6.5 MB），
# 代价是解压时多一次内存拷贝。选纯 Rust 的 lzma-rs，不引 liblzma 的 C 依赖。
lzma-rs = "0.3"

# ★ 刻意不引 tauri：它那 5 MB 是框架（命令注册 / 资源协议 / 插件体系），
#   而安装器只需要「一个 Win32 窗口 + 一个 WebView2 控件 + 一条 JSON 消息」。
#   webview2-com 是微软 WebView2 的官方 COM 绑定的薄封装。
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

# 写「应用和功能」里那条卸载项。与客户端同一个版本（见 src-tauri/Cargo.toml）
winreg = "0.55"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 构建脚本用它把 payload.zip 压成 payload.xz（不进最终安装器）
[[bin]]
name = "pack"
path = "src/bin/pack.rs"
