<!--
  MKP SupportEase 应用图标（母版，作者 2026-10-15 提供）。

  这一份是**作者给的原始母版**（`~/Downloads/Frame 4.svg`）：1024×1024、方角满幅，
  底板 #F0EFEB、图形是黑墨。

  ★★★ 为什么需要它 + 为什么下面套了一层 squircle：
  Tauri 默认生成的图标用的是**普通圆角**（border-radius），而 macOS Big Sur 起规范是
  **squircle 超椭圆**（连续曲率）。作者：「我的 Dock 栏有图标呀，但是那个图标我感觉它的
  圆角好像不自然，没有平滑过渡呢…人家的好像都有平滑过渡的」。
  普通圆角在「直边 → 圆弧」处有转折点，squircle 是顺滑弯进去的。
  ⇒ 母版保持**原样不动**（方角满幅），由 `scripts/gen-icons.py` 负责套 squircle 蒙版。

  改图形的流程：改这个文件（或让作者重出一版）⇒ 跑 `python3 scripts/gen-icons.py`
  ⇒ 跑 `npx tauri icon src-tauri/icons/source/icon-1024.png`。
  **别再手改 `icons/*.png`**（那些都是栅格产物）。
-->
