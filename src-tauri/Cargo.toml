[package]
name = "mkp-support-ease"
version = "0.0.9"
description = "SupportEase —— MKP 支撑辅助桌面端"
authors = ["MuCoreBenC"]
license = "AGPL-3.0-only"
repository = "https://github.com/MuCoreBenC/MKPSupportEase"
edition = "2021"
rust-version = "1.77.2"
# 这个 crate 里有两个 bin（`mkp-support-ease` 本体 + `gen-catalog` 生成器）。
# 不写这一行，`cargo run`（tauri dev / tauri build 走的就是它）会以
# "could not determine which binary to run" 拒绝启动 —— 本体是默认的那个。
default-run = "mkp-support-ease"

[lib]
# 名字里的下划线是 crate 名规范；main.rs 按这个名字调 run()
name = "mkp_support_ease_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 「发布软件版本」的命令行入口（第四刀）。
#
# ★ `required-features`：它整份活在 workbench 那一档里 —— 给用户的二进制（默认 feature）
# **编不到这个文件**，也就不会把"发布"这两个字带进客户端。与 `src/workbench/**`
# 那道闸是同一条思路，只是这道由 cargo 站在编译期守着。
[[bin]]
name = "release"
path = "src/bin/release.rs"
required-features = ["workbench"]

# 「假钩子」：把开场 / 进度 / 那一问 / 结论演给已经开着的那扇窗看（第二次截图改样式用）。
#
# ★ 与 `release` 同一条闸：它**不是产品的一部分** —— 不读 G-code、不跑管线、不落记录，
#   只是照真钩子那条线把消息按节奏发一遍。给用户的二进制里编不到这一份。
[[bin]]
name = "hook-sim"
path = "src/bin/hook-sim.rs"
required-features = ["workbench"]

# 预设工作流 CLI（2026-10-28）：check / generate / diff / verify / publish。
# 与工作台**同一个内核**（workbench::app 里那几个自由函数），只是多一个 AI / 脚本入口。
[[bin]]
name = "presets"
path = "src/bin/presets.rs"
required-features = ["workbench"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }
# build.rs 要读工作台配置（`workbench/bootstrap.json`）把云端源注入二进制 ——
# 那是仓库里唯一一处"发布到哪"的真相（见 build.rs 头注释）
serde_json.workspace = true

# 后厨工作台（B03）。**不在 default 里**是这一整套隔离的根：不带这个 feature 编译时，
# src 下的 workbench 子树连编译都不会被碰，给用户的二进制里搜不到任何工作台命令名。
#
# 与 vite 那边的 `--mode workbench` 是**两道独立的闸**：一道管页面在不在产物里，
# 一道管命令在不在二进制里。任一道漏了，另一道还挡得住。
#
# 它曾经同时是**依赖开关**（`dep:mkpse-preset` 挂在它下面）。2026-10-09 起不再如此：
# 后处理钩子要「预设 → IR」的映射与管线本体，而钩子属于**给用户的那个二进制**
# （一个 exe 两种角色，见 `src/args.rs` / `src/hook.rs`），那两个 crate 因此成了必需依赖。
[features]
default = []
workbench = ["dep:sysinfo"]

[dependencies]
tauri = { version = "2.9.1", features = ["macos-private-api"] }

# 系统文件选择器（第十二层：**通用导入入口**的"选择文件"那一半）。
#
# 为什么值得引入：导入入口是通用的（以后「备份与恢复」继续复用它），而"选文件"是
# 操作系统的事 —— 挑官方 plugin 而不是自己拼 rfd，是因为"在哪个线程弹窗、取消怎么
# 回来"这些平台差异由它包掉。它只在用户点「导入文件…」时弹一个原生对话框；
# 复制由我们自己的导入核心做（源文件全程只读，去处只有 presets-mine/）。
#
# 版本 `2.8` 是**与 npm 那半对齐**的（`@tauri-apps/plugin-dialog@2.8.1`）：
# `tauri dev` 会查两端的 major/minor，错档就报 "version mismatched Tauri packages"。
# 升级时两端成对升（见 ARCHITECTURE §6）。
tauri-plugin-dialog = "2.8"

# 在系统文件管理器里"显示并选中"（第十三层：文件外部管理的第一半）。
#
# 三个平台各有一套做法（macOS `open -R` 那一类、Windows `explorer /select,`、
# Linux 的 FileManager1）—— 由官方 plugin 包掉平台差异，我们只给一个绝对路径。
# **只在 Rust 侧调**（自己的命令体里），所以不需要给它开任何 capability：
# 前端能调的只有我们那条 `reveal_in_folder`，路径先过用户根那两道闸。
tauri-plugin-opener = "2"
# 下面这几个版本住 workspace 根 —— 后处理内核与这里共用它们，
# 两边各写一份就会在依赖树里出现两次（见根 Cargo.toml 的说明）
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# 原子写盘：同目录临时文件 + persist（见 fsx/atomic.rs）
tempfile.workspace = true
# 可观测性走 tracing 一套，不再叠 tauri-plugin-log —— 两套日志栈会各写一份、互相不知道
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
# trace id 用 v7：带时间前缀，按 id 排序就是按时间排序，翻日志时有用
uuid = { version = "1", features = ["v7"] }

# 时间戳（工作台的发布时间戳 + 后处理归档的记录时间）。
#
# **不再是 optional**（2026-10-09）：后处理钩子——默认构建那条路——要写执行记录，
# 记录里的 `startedAt`/`finishedAt` 与目录名 `YYYY-MM-DD` / `YYYYMMDD_HHMMSS`
# 都是用户翻存档时直接看到的本地时间。
# `local-offset` 是 `now_local()` 的门；解析不到时区会回落 UTC（见 `crate::archive`），
# 归档不因为时区解析失败而停。
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

# 只有 workbench feature 用得到的：run-env 闸的**进程探测**——沿祖先链找本进程
# 自己的 `tauri dev` 监视器（读命令行看 --no-watch）、按 PID 杀它。给用户的
# 二进制（默认 feature）编不到 workbench 子树，也就不需要它。
# default-features = false：只要"列进程 + 读命令行 + 杀"，disks/组件/network 那些一律不要。
sysinfo = { version = "0.33", default-features = false, features = ["system"], optional = true }

# 指纹（`presetdata::resolve::Layers::fingerprint`）与预设体摘要都要它。
# 它本来就在依赖图里（tauri-codegen 在编译期用它），所以这里的成本是零。
sha2.workspace = true

# **唯一的 HTTP 客户端**（第二圈：把「下载」从本地目录源换成真远端源）。
#
# **为什么不是异步那一套**：命令体本来就是同步阻塞的磁盘 IO，与其为了一次 GET
# 拉进一整套 async HTTP 栈（runtime + reactor + hyper），不如让阻塞网络与阻塞磁盘
# 同在线程池里——这条路径需要的全部能力就是「GET 一个 URL、拿回字节」，
# 交给 spawn_blocking 就够。
#
# **为什么关默认 feature、只开 rustls**：默认 feature 是 native-tls，
# Linux 上要目标机有 OpenSSL 动态库、Windows CI 上要多一个外部依赖；
# rustls 是纯 Rust，三个 CI job（web / rust / rust-windows）都只从源码编，没有环境差异。
#
# **代价照实说**：它大概是默认构建里最重的一条依赖（带一整套 TLS 栈）。
# 换来的是「开发文件不当运行时数据库」这条铁律的最后一公里——以前
# `download_runtime_file` 得探测仓库绝对路径（`crates/preset/assets/presets`）才跑得通，
# 那不是产品行为，是脚手架。
ureq = { version = "3", default-features = false, features = ["rustls", "multipart"] }

# 图像解码 / 编码（**只 workbench 用**：标注台保存时把框渲进图，落成品 webp）。
#
# **为什么现在才引**（2026-10-16，作者：「保存时就渲一张带框成品图，客户端只读成品」）：
# 在那之前，引导图是「原图 + 前端按 marks 现画框」—— 客户端放大时看得出框是"贴上去的"。
# 成品图把框烧进像素，客户端 `<img>` 直接显示、跨平台一致。
#
# **为什么 `default-features = false` + 只开 png/webp**：默认那套会拖进 jpeg/gif/tiff/avif…
# 与一大堆解码器；这里要的只有「读 PNG（原图）+ 写 WebP（成品）」两件事。
#
# ★ 编码走 `image-webp`（**纯 Rust**，不绑 libwebp）—— 代价是**只能无损**。
#   实测（`cwebp` 对真图量的）：原 PNG 309.5 KB → 无损 webp **77.9 KB**（小 75%），
#   而有损 q90 只再省 ~7 KB ⇒ 不值得为这点体积引一套 C 工具链（三平台 CI 都要能编）。
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

# 编号里那个数字（`workbench/app/render.rs` 的 `draw_number`）。
#
# 2026-10-16 作者点名的病：「为什么编号的数字要用矢量图啊？他不应该用那种开源的免费字体吗」——
# 第一版是**手写矢量描点**（一段段折线硬编码在 `glyph_of` 里），树的是"不引字体库"；
# 代价是字形与标注台/客户端那份（真字体）对不上，且那套描点被反复挑剔地改过好几次。
#
# **`ab_glyph` 是纯 Rust**（底层 `ttf-parser` + `ab_glyph_rasterizer`，无 C 依赖）——
# 与 `image` 选 `image-webp` 同一条理由：三个平台的 CI 都只从源码编，不要环境差异。
#
# 字体本体是 `public/fonts/badge-digits.ttf` —— **Poppins（OFL 1.1）裁到只剩 `0-9`**（2 KB），
# 前端那份 `@font-face` 用的是**同一个文件**（两处一套字，才谈得上"烧出来和标注台一样"）。
# 2026-10-17 由 Inter 换成 Poppins（作者：「这个 1 看起来不在视觉中心」）。
# 许可全文在 `public/fonts/OFL.txt`，别删。
ab_glyph = "0.2"

# 保留格式的 TOML 编辑器（cargo 自己用的那个）。
#
# **选它而不是 `toml` 是一条设计决定，不是口味**：预设层要编辑 `presets/*.toml`，
# 而「读进来不改再写出去必须字节不变」是往那个目录写第一个字节之前必须先绿的判据。
# 用 `toml` 反序列化再重新序列化的话，那条判据要靠我复刻别人 writer 的引号风格、
# 键序、浮点格式才能成立 —— 那是最脆的一类承诺。
# `toml_edit` 保留原文与格式，只改被改的那一处，于是保真在**构造上**成立。
#
# **不再是 optional**：`presetdata`（客户端也在编）读 `presets/*.toml` 用的就是它。
# 版本从 M4b 起住在 workspace 根（`crates/preset` 也用它）。
toml_edit.workspace = true

# 预设解析 crate（**必需依赖**，2026-10-09 起）：
#
# 1. 工作台借它的产物命名规则（`preset::preset_file_name`，权威实现见
#    `crates/preset/src/generate.rs`，规范见 `docs/ARCHITECTURE.md` §10）；
# 2. **后处理钩子借它的「预设 TOML → IR」映射**（`preset::load_ir`）—— 切片器那一条路
#    （`src/hook.rs`）手里是用户预设，而管线吃的是 IR，这个换算全仓只有它一处实现。
#
# 原来它是 optional、只挂在 workbench feature 下（理由：给用户的二进制里不带那批内置数据）。
# 2026-10-09 这条边界移动了：**本程序同时是切片器的后处理钩子**，钩子属于给用户的二进制，
# 所以内核必须进默认构建。代价照实说：那 56 KB 参数注册表与 9 份内置预设现在也在客户端
# 二进制里；换来的是"一个 exe 两种角色"—— 不再需要第二个格式对不上的 exe（那个 exe
# 读不了我们的预设：`offset_x` 会被它判成"这份预设比本程序新"）。
mkpse-preset = { path = "../crates/preset" }

# 后处理内核本体（`crates/postprocess`）：钩子直接用它的 12 步管线与取消线。
# 它虽然已经是 `mkpse-preset` 的依赖，但 Rust 要求"用了谁就直写谁"——
# 不在这里写一行，`src/hook.rs` 里的 `use postprocess::…` 编不过。
mkpse-postprocess = { path = "../crates/postprocess" }

# Ctrl-C → **协作取消**（只在钩子模式装，见 src/hook.rs）：内核在步骤边界停下，
# `.part` 丢掉、原文件不动。装不上处理器不阻断那一趟（最坏退回默认硬杀）。
ctrlc.workspace = true
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

# 原生窗口外观（圆角 + 红绿灯归位）只在 macOS 上有意义，见 src/chrome.rs
[target.'cfg(target_os = "macos")'.dependencies]
# **屏幕引导的取数口**（src/ax.rs）：读切片器窗口与控件坐标走 macOS 的 Accessibility
# C API，而它要拿 CF 类型（CFString / CFArray）去问。这一份本来就在依赖图里
# （objc2 那一族传下来的，锁里是 0.10.1），这里直写一行只是让它能被 `use` 到 ——
# 不新增任何依赖树。
core-foundation = "0.10"
objc2 = "0.6"
# objc2-quartz-core：CALayer 的 cornerCurve —— 圆角曲率要从普通圆弧换成系统原生的连续曲率（见 chrome.rs）
# + `NSColor` 与 `objc2-core-graphics`：圆角窗外那圈填色要算成 CGColor 铺到 CALayer 上
# （见 chrome.rs 的 `paint_corner_fill`）；`objc2-core-graphics` 是它取 `CGColor` 的开关。
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSWindow", "NSToolbar", "NSColor", "NSBox", "NSAppearance", "NSLayoutAnchor", "NSLayoutConstraint", "objc2-quartz-core", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
# + `objc2-core-graphics`：CALayer 的 `setBackgroundColor`（铺圆角窗外那圈填色）在这个 feature 后面
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }

# Windows 那半的**只读查询**：「跟随系统默认」到底是谁，要去问注册表
# （`HKCR\.3mf` → ProgID → `…\shell\open\command`，见 `src/ipc/slicer.rs`）。
# 它是**最小的那种**读写注册表库（没有任何默认 feature），而且
# **本来就在依赖树里**（`embed-resource` 带进来的那一档，锁里是 0.55）——
# 这里直写一行只是让它能被 `use` 到，不新增任何包。
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
# 测试里用它把夹具的 JSON 转成 TOML（`testkit` / `presets::registry`），
# 以及把产出的 TOML 解析回来（`app::build`）。版本取 workspace 那一档（0.8，见根上的说明）
toml.workspace = true
