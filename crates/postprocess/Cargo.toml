# 后处理内核 —— 从 mkp-ssr 的 `crates/core` 整包搬入（b04 Task 13）。
#
# 搬入是**两笔**：M2a（`47436e4`）先原样复制、连包名都不改，拿「122 个文件逐文件 sha256
# 与源一致」当搬运证据；M2b（`d3f542b`）再单独一笔改名 —— 包 `mkpse-postprocess`、
# lib `postprocess`、bin `mkpse-pp`。拆开是因为改名要动 24 个文件（含 3 个测试文件），
# 机械改动与搬运错误混进同一条 diff 的话，「那 20 个测试文件全绿」就不再是搬运证据了。
#
# 源仓库那份清单顶上写着「包名刻意仍叫 mkp-pp……等 K1..K7 全绿之后再考虑改名」——
# 那是**那边**的决定，依赖他们那套跨仓 sha256 比对判据。我们不走那条路：
# 搬运证据换成了 M2a 的零 diff，于是改名可以立刻做，也不需要任何过渡别名。
#
# 一个 lib + 一个 bin。刻意不是多 crate：链条只剩
# cli → pipeline → postproc → ir → gcode/diag 一条直线，
# 代价（丢掉 Cargo 强制的分层判据）由 tests/boundaries.rs 的文本判据接手。
#
# bin `mkpse-pp` **保留但不进 .app 包**：check / dump-ir 是诊断预设与 IR 的唯一手段，
# 且 tests/cli.rs 依赖它（删掉等于删判据）。分发物只有 src-tauri 那一个可执行物。
[package]
name = "mkpse-postprocess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "MKP 后处理内核：G-code + IR 配置 → 处理后 G-code"

[lib]
name = "postprocess"
path = "src/lib.rs"

[[bin]]
name = "mkpse-pp"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
# float_roundtrip 是判据正确性开关，理由见根 Cargo.toml 的注释。**搬家时漏了会得到假红。**
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
clap.workspace = true
# Ctrl-C → CancelToken（成熟件不自造信号处理）
ctrlc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
# 领 workspace 那组（今天只有 unsafe_code = "forbid"）。
#
# **这里不能再写 [lints.clippy]** —— cargo 1.97 实测：
#   cannot override `workspace.lints` in `lints`, either remove the overrides
#   or `lints.workspace = true` and manually specify the lints
# 所以源仓库那份清单里的一段注释挪到这上面，内容一字不改：
#
# 刻意**不** deny clippy::suboptimal_flops：它给的修复建议正是 mul_add —— 与
# 「几何层禁 FMA 融合」直接矛盾（源仓库 Task 3 实测撞上：a*b+c 的直写形态被它
# 建议改成 mul_add）。真·守卫是 tests/boundaries.rs 的 no_fma 文本扫描；
# 这里若 deny 等于逼人违规。
workspace = true
