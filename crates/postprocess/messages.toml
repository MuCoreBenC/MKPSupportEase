# ==================== 「去系统里改默认打开方式」那扇引导（2026-10-30） ====================
#
# 这四句原来**硬编码在 `src-tauri/src/ipc/slicer.rs` 里**（作者 2026-10-30 让做中英双语时
# 才浮出来）：界面切到 English 时，引导右侧的步骤是英文（`settings.guide.step*` 走前端表），
# 而顶上一整段状态句仍是中文 —— 同一扇窗里两种语言，看着像 bug。
#
# 为什么它们当初在代码里：这几句带**平台知识**（macOS 的访达/桌面、Windows 的「始终」勾选框），
# 谁写这段逻辑谁最清楚该怎么说，顺手就 format! 了。现在统一收到表里，平台差异仍在
# `slicer.rs`（它决定**取哪条键**），措辞回表（这里决定**怎么说**）。
#
# ★ 153 / 154 那两条的 `{steps}` / `{where_it_is}` 由调用方填 —— 现在填的是 510 / 511
#   这两条**已按当前语言取过**的句子，所以整段跟着界面语言走。

["ui.ipc.slicer.509"]
text = "已打开「{name}」的「显示简介」—— 在「打开方式」里选好应用，再点右边的「更改全部…」（不点它只对这一个文件生效）。这窗口由 macOS 开在访达所在的那个桌面 —— 眼前没看到的话，去访达那个桌面找"
text_en = "Opened “Get Info” for “{name}” — pick the app under “Open With”, then click “Change All…” to its right (without that click the change applies to this file only). macOS opens this window on the desktop where Finder lives — if you cannot see it, switch to that desktop."
text_zh_tw = "已開啟「{name}」的「顯示簡介」—— 在「開啟方式」裡選好應用，再點右邊的「更改全部…」（不點它只對這一個檔案生效）。這窗口由 macOS 開在訪達所在的那個桌面 —— 眼前沒看到的話，去訪達那個桌面找"
text_ja = "「{name}」の「情報を見る」を開きました — 「開くアプリ」でアプリを選び、右の「すべてを変更…」をクリックしてください（押さないとこのファイルだけに適用されます）。このウィンドウは macOS が Finder のあるデスクトップに開きます — 見当たらない場合は Finder のデスクトップを探してください"
params = ["name"]
note = "macOS 走通时回给引导弹窗的那整段状态句；「更改全部…」必须点名，不点只对这一个文件生效"

