# 「用户读到的那一句话」全住在这里 —— 业务代码里不许再写死文案。
#
# # 为什么是一张表
#
# 同一条错误，四个读者要的东西不一样：切片器那一框（它只该看到人话，见下）、本程序的
# 模态框、执行记录（`_meta.json`）、日志。它们以前各拼各的 —— 于是同一件事在四处长得
# 不一样，改动一次要 grep 五处，还出过「两层错误码糊在一句里」那种噪音
# （`处理失败 [E_CFG_INVALID_001]：配置无效: E_GCODE_BOUNDARY_001: …`）。
#
# 这张表把**码、人话、给谁看**摆在一起：改文案 / 改可见性只动这一处。
#
# # 它是编译进去的
#
# `include_str!`（见 `src/diag/messages.rs`）—— 不是运行时读的配置文件：没有「用户把表
# 删了 / 改坏了 / 放了个半截」这种状态，也就没有兜底分支要写。改表 = 重新编译一次。
#
# # 字段
#
# - 键           —— 条目的名字。**与错误码同名的那几条是内核错误**（`PostprocError` 的每个
#                  码都必须有一条，判据钉着，见 `diag/error.rs` 的测试）；`hook.*` 那几条是
#                  **钩子层**（`src-tauri/src/hook.rs`）自己的说法。
# - code         —— 对外稳定错误码。**键本身就是码时可省**（`E_*` 开头的键按码算）；
#                  `hook.*` 那几条要给码才写。同一个码允许在两层各有一条（说法不同是常态：
#                  内核那句给排查，钩子那句给用户）。
#
#                  ★★★ **每一条用户能读到的句子都必须有码**（2026-10-17 作者定）：
#                  「这样就方便我给 AI 去看啊，这样子，就算信息不全，也能通过错误码找到对应的」。
#                  前三个字母是**类别**，一眼分得出"出故障"还是"你自己让它停的"：
#
#                    E_*  故障  —— 系统判定这件事没成（解析失败、写盘失败、内核报错…）
#                    W_*  停下  —— **不是故障**：用户按了停止 / 在问句里选了停 / 某一步降级了
#                                  （归档没落成但 G-code 是好的那几条也归这儿）
#                    N_*  成功  —— 跑完了。几种"都算成功但结果不同"的情形各有各的码
#                                  （校准件：`N_CALIB_PRINT_001` / `N_CALIB_DIRECT_001`）
#                    Q_*  提问  —— 钩子停下来问用户的那几句（不是错，也不是结束）
#
#                  `*_NNN` 那截是序号，**加新条目就往后排，不要复用/改号** ——
#                  改了号，用户贴在 issue 里的旧码就搜不到了。
#
#                  查码的入口：`python3 scripts/message-codes.mjs <码或键>` 打印这句的
#                  全部口径（`text` / `slicer` / 参数 / 说明）；不带参数则列出整张码表。
# - text         —— 本程序里给用户看的那一句（界面模态框、执行记录、日志）。`{名字}` 是占位符。
# - slicer       —— 给**切片器**那一行的口径，缺省 = 与 `text` 同一句。
#                  ★ 「让切片器少看 / 别看 / 换个说法」就写在这个字段上。
#                  （切片器那一框的实际行为、为什么只有 macOS 会显示，见
#                  `docs/HOOK-ERRORS-AND-MESSAGES.md`。）
# - params       —— 本条用到的占位符名字。**不是给运行时看的**（渲染时找不到就原样留
#                  `{名字}`，一眼看得见），是给判据看的：每个占位符都要在这里登记，
#                  这里登记的每个名字都要真被用到 —— 缺登记与多余登记都算红的。
# - note         —— 给改表的人看的说明，运行时零消费。
#
# 占位符里几个固定名字的含义（内核那几条统一用它们）：
#   {detail}      —— 内核就地拼出来的**诊断细节**（解析器的报错、参数名与量程…）。
#                    这一档刻意留白：它们是数据不是文案，形态各异，硬套模板只会失真。
#   {op}          —— 内核里那个操作名（`read_preset` / `read_gcode` / `write_output`）。
#                    给排查用，不是给用户读的漂亮话。
#   {diagnostics} —— 校准形变的机器判据（expected=… actual=…）。**切片器那一面把它去掉**：
#                    用户要看的是"别转我的校准模型"，不是那串数值。

# ---------------------------------------------------------------- 内核错误（码 = 键）

["E_FILE_READ_001"]
text = "文件读写失败（{target}）：{detail}"
text_en = "File read/write failed ({target}): {detail}"
slicer = "这份文件读不出来 —— 检查它还在不在、是不是被别的程序占着"
params = ["target", "detail"]
note = "旧码复用：旧侧 filesystem 模块也拿它表示读写失败（见 diag/error.rs 的码对照）。{target} 两种来源：读侧是操作名（read_gcode…），写侧是落点路径"

["E_FS_NOT_FOUND_001"]
text = "找不到文件（{target}）：{detail}"
text_en = "File not found ({target}): {detail}"
slicer = "找不到这次要处理的那份文件（预设或 G-code）—— 检查路径还在不在"
params = ["target", "detail"]

["E_TOML_PARSE_001"]
text = "预设解析失败（TOML 语法）：{path} —— {detail}"
text_en = "Cannot parse the preset (TOML syntax): {path} — {detail}"
slicer = "这份预设本程序读不出来（多半是用别的版本导出的）—— 换一份，或把这份发给我们"
params = ["path", "detail"]

["E_CFG_PARSE_001"]
text = "这份预设的机型不认识：换一份对应机型的预设（{path}）"
text_en = "This preset is for an unknown machine: use a preset made for this machine ({path})"
params = ["path"]
note = "刻意与旧侧不同：那边写「预设文件缺少 # machine: 声明」，而本项目的机型名是配置里的普通字段"

["E_CFG_INVALID_001"]
text = "配置无效：{detail}"
text_en = "Invalid configuration: {detail}"
params = ["detail"]
note = "**兜底码**：参数级校验失败都走它。更具体的错走自己的码（如 E_GCODE_BOUNDARY_001）"

["E_GCODE_COLLISION_001"]
text = "模型与擦料塔的位置冲突：挪开模型或换一个擦料塔位置再切片"
text_en = "The model collides with the wipe tower: move the model or pick another tower position and slice again"
slicer = "模型与擦料塔的位置冲突 —— 回切片器挪开模型再切一次"

# 建议那句（2026-10-18）—— **同一件事的三种处置**，码分开排，旧号一个不动。
# 谁挑这句：`postproc::disk::CollisionResult::advice` 按 `collision_type` 分档。
# 数字是"至少挪多少"（内核那边已经按 0.1mm 向上取整过）。
["E_GCODE_COLLISION_002"]
text = "建议：把模型往{direction}挪 —— {amounts}"
text_en = "Suggestion: move the model {direction} — {amounts}"
params = ["direction", "amounts"]
note = "挪模型的那一档：方向是内核按最小退出距离挑出来的（旧侧 resolveModelAdjustment）；amounts 只列真要动的轴（单轴方向下另一边不写 0）"

["E_GCODE_COLLISION_003"]
text = "模型这边挪不开了：建议调整擦料塔位置（wiper_x / wiper_y）后再切片"
text_en = "The model cannot move any further this way: change the wipe tower position (wiper_x / wiper_y) and slice again"
note = "兜底：三个候选方向都挪不开（越界或挪完还撞），只能动塔"

["E_GCODE_COLLISION_004"]
text = "擦料塔位置落在机型的额外禁区里：把塔挪开 —— {amounts}（或改机型的禁区配置）"
text_en = "The wipe tower sits inside a machine exclusion zone: move the tower — {amounts} (or change the machine exclusion settings)"
params = ["amounts"]
note = "禁区那一档：挪的是塔不是模型，数字是最小平移向量（MTV）；amounts 只列真要动的轴"

["E_CAL_FAILED_001"]
text = "校准代码没有生成出来：{detail}"
text_en = "The calibration code was not generated: {detail}"
slicer = "校准代码没有生成出来 —— 详见日志，把日志里那一段发给我们"
params = ["detail"]

["E_CAL_MISMATCH_001"]
text = "检测到校准模型可能被旋转。请勿旋转校准模型。（{diagnostics}）"
text_en = "The calibration model may have been rotated. Do not rotate the calibration model. ({diagnostics})"
slicer = "检测到校准模型可能被旋转 —— 请勿旋转校准模型，只移动位置（详情见日志）"
params = ["diagnostics"]

["E_CAL_MISMATCH_002"]
text = "检测到校准模型尺寸已变化。请勿缩放校准模型，仅允许移动位置。（{diagnostics}）"
text_en = "The calibration model has changed size. Do not scale the calibration model; only moving it is allowed. ({diagnostics})"
slicer = "检测到校准模型尺寸已变化 —— 请勿缩放校准模型，只移动位置（详情见日志）"
params = ["diagnostics"]

["E_GCODE_FAILED_001"]
text = "处理失败：{detail}"
text_en = "Processing failed: {detail}"
params = ["detail"]

["E_SYS_CANCELLED_001"]
text = "已取消：{detail}"
text_en = "Cancelled: {detail}"
params = ["detail"]
note = "内核那一路（Ctrl-C）。用户在界面上按的停止由钩子层的 hook.cancelled 说"

["E_GCODE_BOUNDARY_001"]
text = "模型超出打印边界，{sides}"
text_en = "The model exceeds the print boundary, {sides}"
slicer = "模型超出打印边界，{sides} —— 回切片器挪一下模型再切"
params = ["sides"]

["E_GCODE_BOUNDARY_002"]
text = "模型超出涂胶范围，{sides}"
text_en = "The model exceeds the glue area, {sides}"
slicer = "模型超出涂胶范围，{sides} —— 回切片器挪一下模型再切"
params = ["sides"]

# 边界那一句的几个零件（合起来才是上面 `{sides}`）—— 它们同样是文案，所以也住这里
["boundary.clause"]
text = "当前{axis}：{current}mm，允许范围：{limit}"
text_en = "Current {axis}: {current}mm, allowed range: {limit}"
params = ["axis", "current", "limit"]

["boundary.limit.max"]
text = "≤{value}mm"
text_en = "≤{value}mm"
params = ["value"]

["boundary.limit.min"]
text = "≥{value}mm"
text_en = "≥{value}mm"
params = ["value"]

["boundary.separator"]
text = "，"
text_en = ", "

# ---------------------------------------------------------------- 钩子层（切片器 + 界面）

# 前置检查：三句都在「还没碰过用户的文件」阶段，原文件一字未动
["hook.preset_missing"]
code = "E_FS_NOT_FOUND_001"
text = "预设文件不存在：{path}"
text_en = "The preset file does not exist: {path}"
slicer = "找不到预设文件：{path} —— 检查切片器「后处理脚本」框里那条命令"
params = ["path"]

["hook.gcode_missing"]
code = "E_FS_NOT_FOUND_001"
text = "输入 G-code 不存在：{path}"
text_en = "The input G-code does not exist: {path}"
slicer = "切片器给的 G-code 不在：{path}"
params = ["path"]

["hook.gcode_unreadable"]
code = "E_FILE_READ_001"
text = "读不到输入 G-code：{path}（{detail}）"
text_en = "Cannot read the input G-code: {path} ({detail})"
slicer = "读不到切片器给的那份 G-code：{path}"
params = ["path", "detail"]

["hook.mismatch_question"]
code = "Q_CFG_MISMATCH_001"
text = "G-code 是 {gcode}，预设是 {preset} —— 机型对不上，结果可能出错。还继续吗？"
text_en = "The G-code is {gcode} but the preset is {preset} — the machine does not match and the result may be wrong. Continue anyway?"
params = ["gcode", "preset"]
note = "2026-10-17 作者：「文案不好，什么纬度？你就用很简单的文案，简短几行的」—— 原来那句解释「维度与打印边界会按预设算」，是内核口径、不是用户的话"

["hook.mismatch_stopped"]
code = "W_CFG_MISMATCH_001"
text = "已停下（机型不匹配：G-code 是 {gcode}，预设是 {preset}）—— 原文件没有被改动"
text_en = "Stopped (machine mismatch: the G-code is {gcode}, the preset is {preset}) — the original file was not changed"
slicer = "机型不匹配，按你的选择停下：G-code 是 {gcode}，预设是 {preset}；原文件没有被改动"
params = ["gcode", "preset"]

["hook.calib_mode_question"]
code = "Q_CALIB_MODE_001"
text = "这份 G-code 是{kind}件。保留打印件一起后处理，还是只跑校准？"
text_en = "This G-code is a {kind} part. Should the printed part be kept and post-processed with it, or only the calibration run?"
params = ["kind"]
note = "2026-10-17：后处理认出这是校准件时那一问（作者：「后处理会识别到是校准文件的时候」）。{kind} = Z 偏移校准 / XY 精度校准 / XY 粗校准 / 重复性校准。选项的后果写在按钮上（print / direct），正文**不再重复选项名**——按钮就在下面一行"

["hook.calib_stopped"]
code = "W_CALIB_MODE_001"
text = "已停下（{kind}校准件，没有选校准方式）—— 原文件没有被改动"
text_en = "Stopped ({kind} calibration part, no calibration mode chosen) — the original file was not changed"
slicer = "校准件没有选校准方式，按你的选择停下：原文件没有被改动"
params = ["kind"]

["hook.calib_done_print"]
code = "N_CALIB_PRINT_001"
text = "打印件保留，只加了涂胶与擦料 —— 处理完成"
text_en = "The printed part was kept and only glue and wipe passes were added — done"
note = "2026-10-17：校准件那一问答「先打印，再校准」的成功结论。两种跑法**都是成功**，同一屏，只有这一句不同；界面读 `finished.calibChoice`，报告读 `_meta.json` 的 `calib_choice` —— 同一个键，不许两边各写一份"

["hook.calib_done_direct"]
code = "N_CALIB_DIRECT_001"
text = "已去掉打印件，只保留校准路径 —— 处理完成"
text_en = "The printed part was removed and only the calibration path was kept — done"
note = "2026-10-17：校准件那一问答「直接校准」的成功结论（口径同 `hook.calib_done_print`）"

["hook.tower_relocation_question"]
code = "Q_COLLISION_RELOCATE_001"
text = "擦料塔与模型发生碰撞，是否自动调整擦料塔位置？"
text_en = "The wipe tower collides with the model. Adjust the wipe tower position automatically?"
note = "2026-10-18：挪塔那一问。开关（设置页「智能塔位置」）开着才问；答 relocate ⇒ 只改这一趟的 wiper_x/wiper_y 继续跑完；答 model / 超时 ⇒ 停下（与机型那一问同一条）。画布几何走 QuestionPayload.geo"

# ---- 挪塔那一问的三种收场 + 一种"挪不动"（2026-10-18）----
# 码不复用：Q_ 是问句、N_ 是成了、W_ 是"停下了/降级了"（不是故障）。
["hook.tower_relocated_ok"]
code = "N_COLLISION_RELOCATE_001"
text = "擦料塔已从 X {fromX} / Y {fromY} 挪到 X {toX} / Y {toY}（{moved} mm），复检没有冲突"
text_en = "The wipe tower moved from X {fromX} / Y {fromY} to X {toX} / Y {toY} ({moved} mm); the re-check found no collisions"
slicer = "擦料塔位置已自动调整（{moved} mm），这一盘照常后处理"
params = ["fromX", "fromY", "toX", "toY", "moved"]
note = "2026-10-18：答「自动挪塔」并复检通过时的成功句（也是报告页/执行记录那一格的结论句）。只改这一趟，预设文件不动"

["hook.tower_relocated_still"]
code = "W_COLLISION_RELOCATE_001"
text = "擦料塔已从 X {fromX} / Y {fromY} 挪到 X {toX} / Y {toY}（{moved} mm），但这个位置仍然有 {count} 个冲突点 —— 这一趟停下了，原文件没有被改动"
text_en = "The wipe tower moved from X {fromX} / Y {fromY} to X {toX} / Y {toY} ({moved} mm), but this position still has {count} collision points — stopping this run"
slicer = "自动挪塔之后仍然有冲突 —— 回切片器把模型挪开一点再切"
params = ["fromX", "fromY", "toX", "toY", "moved", "count"]
note = "2026-10-18：**第二道闸**。挪完必须复检（同一个 detect_tower_collision），仍撞就不静默继续 —— 作者真机「点了自动挪塔还是碰撞」就是缺这道闸"

["hook.tower_relocate_declined"]
code = "W_COLLISION_RELOCATE_002"
