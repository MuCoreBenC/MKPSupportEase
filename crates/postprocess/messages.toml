params = ["detail"]

# ---------------------------------------------------------------- 结论行的框子

# 切片器那一行（stderr）与界面那一屏共用同一个「原因」，但**框子**分开写：
# 切片器只看到一句结论，界面上有自己的表头，不需要"处理失败："那层皮。
["hook.line.failed"]
code = "W_LINE_FAILED_001"
text = "处理失败：{reason}［{code}］"
text_en = "Processing failed: {reason} [{code}]"
params = ["reason", "code"]

# 失败但没有码：理论分支（现在每一条失败都有码，留着是为了"哪天有人加了一条无码的
# 失败"时，那一行仍然是一句人话，而不是一个空框）
["hook.line.failed_nocode"]
code = "W_LINE_FAILED_002"
text = "处理失败：{reason}"
text_en = "Processing failed: {reason}"
params = ["reason"]

["hook.line.stopped"]
code = "W_LINE_STOPPED_001"
text = "已停止：{reason}［{code}］"
text_en = "Stopped: {reason} [{code}]"
params = ["reason", "code"]

["hook.line.cancelled"]
code = "W_LINE_CANCELLED_001"
text = "已取消：{reason}［{code}］"
text_en = "Cancelled: {reason} [{code}]"
params = ["reason", "code"]
note = "2026-10-17：框子里原来**没有 {code}**，于是用户自己按停止时日志那一行是 `code=\"\"` —— 这正是\"信息不全就定位不了\"的那种。现在与另三档一样把码写在句子里"

["hook.log_path"]
code = "N_LOG_PATH_001"
text = "完整日志：{path}"
text_en = "Full log: {path}"
params = ["path"]
note = "失败/取消时追加在结论后面那一行 —— 用户报问题时把日志整段给我们"

