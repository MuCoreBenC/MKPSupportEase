# 预设 TOML → IR 的映射层，自 mkp-sr 切片（`crates/preset` + `crates/ir/src/build.rs`）。
#
# **为什么独立成 crate，而不是塞进内核的一个模块**：mkp-pp/AGENTS.md §4 记着一条
# 「ir 之后不再读 TOML，但今天没有门禁」的约束。独立成 crate 之后依赖方向是
# preset → postprocess 单向，postproc 想读 TOML 就得依赖本 crate，而那是反方向 —— Cargo 会拦。
# 编译器接手了原来只靠人守的约束。
#
# **不搬** mkp-sr 的 `ui.rs`（UI 元数据）。
#
# `write.rs`（toml_edit 保注释写回）**这一轮搬回来了**（spec `preset-editing-amber-labels`）：
# GUI 要让用户改预设，而用户的预设里约 70 条注释 / 100 行，
# 「读成结构体再序列化」会把它们全抹掉。代价照实说：多了一整类「改坏用户预设」的事故面，
# 兜着它的是 K-P1（零编辑往返逐字节相同）/ K-P2（单键改值只有那一行变）/
# K-P3（拒绝新增键）+ 落盘前的 read + load_ir 复检 + 备份。
[package]
name = "mkpse-preset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "预设 TOML（snake_case 用户参数）→ 内核 IR（PascalCase）的唯一映射点"

# lib 名显式写死：包名带连字符时 cargo 会推出 `mkpse_preset`，
# 而迁移定案（tasks.md 15.1）要的是代码里写 `preset::`。
[lib]
name = "preset"
path = "src/lib.rs"

[dependencies]
# 唯一的内部依赖，方向 preset → 后处理内核（原 `core`，本仓叫 `postprocess`）。
mkpse-postprocess = { path = "../postprocess" }
serde.workspace = true
toml.workspace = true
# 血统摘要（判「官方版变了没有」用它）。workspace 依赖，`crates/postprocess` 已经在用，
# 提成本 crate 的显式依赖不引入新编译单元。
sha2.workspace = true
# 写回面：只有它能保住注释与键序（`toml` 0.8 的公共 API 两个都不保）。
# 版本住在 workspace 根：`src-tauri` 也用它（工作台写回预设），两边各写一份
# 就会在依赖树里出现两次，而「`cargo tree -d` 不新增重复」是迁移验收的一条判据。
toml_edit.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# registry_branch_diff 判据要把 build 输出序列化成 JSON 做字段树比较。
serde_json.workspace = true
# load_ir 的整链判据要把输入复制到临时目录再原地覆盖。
tempfile.workspace = true

[lints]
workspace = true

# `gen-presets` 已于 2026-11-04 退役（作者裁定：正式产物以工作台这一代为准）。
# 它渲染的四行头带 `# uuid` / `# release_time`，而现役产物按 2026-10-05 / 11-01 的裁定
# 只有 `# machine` / `# variant` / `# generated_at`；两个出口共写 assets/presets/ 会互相覆盖。
# 现在这个目录的**唯一写入方**是工作台 `wb_generate` / `wb_sync_baseline`（走
# `preset::generate::sync_baseline`）。2026-11-12 起配方正文 `preset_recipes.toml` 与
# `Recipe` / `recipe_edit` / `write_all` / 预检里的「清单 ↔ 配方对齐」一并退役：
# `presets/*.toml` 是唯一权威源，产物由工作台渲染，两条数据源不再并存。
