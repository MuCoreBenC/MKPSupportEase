glue_z_compensation_mode = "bed" # 补偿范围模式: bed=热床范围(±0.2mm), patch=涂胶面范围(±0.1mm)
glue_z_compensation_patch_bl = 0 # 涂胶面后左角Z补偿 范围:-0.1~0.1
glue_z_compensation_patch_br = 0 # 涂胶面后右角Z补偿 范围:-0.1~0.1
glue_z_compensation_patch_fl = 0 # 涂胶面前左角Z补偿 范围:-0.1~0.1
glue_z_compensation_patch_fr = 0 # 涂胶面前右角Z补偿 范围:-0.1~0.1
glue_z_lift_height = 5 # 涂胶Z抬升高度(mm) 范围:5~10
glue_z_lift_height_first_layers = 6 # 前3层抬升高度(mm) 范围:6~10
ironing_coverage_threshold = 10 # 熨烫覆盖率阈值(%) 范围:0~100
ironing_e_sum_threshold = 7.9 # 熨烫E总和阈值 范围:0~100
ironing_mode = "off" # 熨烫模式: off=始终移除, on=始终保留, auto=自动判断
ironing_suppress_expand = 0 # 熨烫抑制扩展(mm) 范围:0~20
