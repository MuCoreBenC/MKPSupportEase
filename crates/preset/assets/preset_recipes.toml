# 预设配方 —— **这一份是真源**（spec `recipe-workbench` §0 翻的案）。
#
# **一台机型一份正文**（spec `machine-owns-its-body`）：正文长在机型上，没有共享的模板。
# 为什么不共享：借来的模板会让「这台机型漏写的键」静默拿到**别台机器**的值，
# 而那种错在产物上看不出来（它「有值」），判据也咬不到（K-G7 只保证产物与配方一致）。
# 删掉共享的东西之后，那类错没有表达方式了。
#
# 覆盖表**只有变体级**（键一律 `机型:变体`）：机型级那一层已经取消，
# 一台机型共用的值就写在它自己的正文里。
#
# 改它 = 出新一批预设。改完要走完这条链，否则判据会红：
#   ① 这个文件           ← 真源（手改，或用 `--recipe-window` 那扇工作台）
#   ② crates/preset/assets/presets/            ← 生成物：`gen-presets --write`（判据 K-G7）
#   ③ crates/postprocess/tests/fixtures/presets/ ← 对照基线：确认 diff 是你要的之后再同步（K-G0'）
#
# ②③ 两边的文件名**是同一个**：`{机型 id}-{版本 id 小写}.toml`，由 `generate::file_name`
# 算出（规范见 `docs/ARCHITECTURE.md` §10）。b05 Task 5 之前基线沿用云端旧名
# （`A1MF_260628.toml` 之类），两边对不上，配对只能读文件头；现在按名字直配，
# 配对这一步不再读文件内容 —— 读到的第一处差异就是真差异。
#
# **③ 是唯一的安全网**：它守的不是「数值对」，而是「没有未经审阅的变化」。
# 配方里一个数改错了不会有任何判据报红 —— 那种错只有 `git diff` 与真机打印看得出来。
#
# `uuid` 与 `release_time` 写死在这里 —— 生成时现取会让「重新生成逐字节相同」失效。


release_time = '2026-08-19 01:38:13'

