# machine: A1_MINI
# variant: fast

# 契约夹具：只放解析/写回判据真正用到的字段，其余走结构默认值（`TomlConfig` 是
# `serde(default)`）。
#
# **文件名与业务命名规则无关** —— 业务改版本 id、改产物文件名，这份不动。
# 要新形态就在这里加，不要在别处复制一份。

[toolhead]
# 标量 + 行尾注释：写回时值要换、注释要留
offset_z = 0.0            # 笔尖 Z 偏移

# 整数形态的浮点：写回要沿用原来的形态（65.0 写成 `65`，不补小数点）
speed_limit = 0           # 速度上限

# 多行字面量：写回时必须还是 `"""` 形态，不许塌成单行转义串
custom_mount_gcode = """
G1 X0 Y0
"""

[wiping]
# 单行字符串：收到换行必须拒绝，不许悄悄改成多行字面量
have_wiping_components = "tower"   # 擦料部件
